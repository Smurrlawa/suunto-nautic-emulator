  function logDetail(lg) {
    const samples = lg.samples || [];
    const W = 600, H = 170;
    const maxD = Math.max(5, lg.maxDepth * 1.1);
    const tmax = Math.max(1, lg.duration);
    const pts = samples.map((s) => (20 + s.t / tmax * (W - 40)).toFixed(1) + ',' + (10 + s.d / maxD * (H - 20)).toFixed(1));
    const prof = '<svg class="prof" viewBox="0 0 ' + W + ' ' + H + '"><rect x="20" y="10" width="' + (W - 40) + '" height="' + (H - 20) + '" fill="#13214d"/><path d="M20 10 L' + pts.join(' L') + ' L' + (W - 20) + ' 10" fill="none" stroke="#19e6c8" stroke-width="3"/></svg>';
    const md = SN.U.depth(lg.maxDepth, 1), ad = SN.U.depth(lg.avgDepth, 1);
    const tmn = SN.U.temp(lg.tempMin), tmx = SN.U.temp(lg.tempMax);
    const gl = lg.gases.map((g) => '<div class="lgas"><div><b>' + esc(g.name) + '</b> <small>' + esc(t('Tank size')) + ' ' + tankSizeStr(g.tank) + '</small></div>' +
      (g.startP && g.startP.length ? '<div class="lgp">' + I.pod + ' ' + g.startP.map((p, i) => Math.round(p) + ' → ' + (g.endP[i] != null ? Math.round(g.endP[i]) : '- -')).join(' / ') + ' bar' + (g.avgRmv ? '<br><small>Avg. ' + g.avgRmv.toFixed(1) + ' L/min</small>' : '') + '</div>' : '') + '</div>').join('');
    const tis = '<div class="tis big"><div class="tisbars">' + (lg.tissues || []).map((c) => '<i class="' + (c.overM ? 'r' : c.overAmb ? 'y' : 'g') + '" style="width:' + Math.min(150, c.ratio * 100) / 150 * 100 + '%"></i>').join('') + '</div></div>';
    const s = new InfoScreen({
      cls: 'tall',
      content: () => (lg.deviation ? '<div class="devhdr">' + I.warn + ' ALGORITHM DEVIATION</div>' : '') +
        '<div class="sumtop"><div class="hdr-t">DIVE<br>SUMMARY</div><div class="sumdur">' + esc(fmt.durLog(lg.duration)) + '</div></div>' +
        '<div class="sec">Depth</div><div class="grid2">' + '<div class="kv"><div class="v">' + num(ad.v, ad.u) + '</div><div class="k2">Avg.</div></div><div class="kv"><div class="v">' + num(md.v, md.u) + '</div><div class="k2">Max.</div></div></div>' +
        '<div class="ptimes"><span>' + fmt.clock(lg.start) + '</span><span>' + fmt.clock(lg.end) + '</span></div>' + prof +
        '<div class="sec">Temperature</div><div class="grid2"><div class="kv"><div class="v">' + num(tmn.v, tmn.u) + '</div><div class="k2">Min.</div></div><div class="kv"><div class="v">' + num(tmx.v, tmx.u) + '</div><div class="k2">Max.</div></div></div>' +
        '<div class="band">GAS LIST</div>' + gl +
        '<div class="grid2">' + kv('Gradient factors', lg.algoOn === false ? 'Off' : lg.gf.lo + '/' + lg.gf.hi) + kv('CNS / OTU', lg.cns + '% / ' + lg.otu) +
        kv('Avg. heart rate', lg.hrAvg ? lg.hrAvg + ' bpm' : '- -') + kv('Surface time', lg.surfaceBefore != null ? fmt.surfTime(lg.surfaceBefore).v + fmt.surfTime(lg.surfaceBefore).u : '- -') +
        kv('Feeling', lg.feeling ? lg.feeling : '- -') + kv('Start / End', fmt.clock(lg.start) + ' – ' + fmt.clock(lg.end)) + '</div>' +
        '<div class="sec">Tissues</div>' + tis,
    });
    push(s);
  }
  function feeling(lg, then) {
    push(L({
      title: 'How was it?',
      items: ['Weak', 'Average', 'Good', 'Very good', 'Excellent'].map((f) => ({ label: f, onOk: () => { lg.feeling = f; S.save(); nav.pop(); then(); } })),
      onBack: () => { nav.pop(); then(); },
    }));
  }

  // =================== Karte (Kap. 12.1) ===================
  function posStr() {
    const { lat, lon } = S.env;
    const f = S.settings.nav.posFormat;
    const dms = (v, p, n) => {
      const a = Math.abs(v); const d = Math.floor(a); const mm = (a - d) * 60; const m = Math.floor(mm); const s = (mm - m) * 60;
      if (f === 'WGS84 Hd.d°') return a.toFixed(5) + '°' + (v >= 0 ? p : n);
      if (f === 'WGS84 Hd°m.m\'') return d + '°' + mm.toFixed(3) + '\'' + (v >= 0 ? p : n);
      return d + '°' + String(m).padStart(2, '0') + '\'' + s.toFixed(1).padStart(4, '0') + '"' + (v >= 0 ? p : n);
    };
    if (!/^WGS84/.test(f)) return esc(f) + ': n/a';
    return dms(lat, 'N', 'S') + ' ' + dms(lon, 'E', 'W');
  }
  const map = { zoom: 3, panX: 0, panY: 0, panning: false };
  const SCALES = ['50 m', '200 m', '1 km', '5 km', '20 km', '100 km'];
  function mapWidget() {
    const scr = {
      render() {
        const st = S.settings.nav.mapStyle;
        const cpass = !S.env.compassCal ? '<div class="cal sm"><div class="calic">' + I.infinity + '</div><div>Calibrate compass</div></div>' : '';
        return '<div class="scr mapw style-' + st.replace(/\s/g, '') + '">' + SN.ui.hints() +
          '<div class="mapl"><div class="mcomp">' + SN.face.fieldHTML('compass', 'large') + '</div>' + cpass + '<div class="mpos">' + posStr().replace(' ', '<br>') + '</div></div>' +
          '<div class="mapr"><svg viewBox="0 0 400 380" preserveAspectRatio="none"><g transform="translate(' + map.panX + ',' + map.panY + ') scale(' + (1 + (5 - map.zoom) * 0.25) + ')">' +
          '<rect x="-400" y="-400" width="1200" height="1200" class="water"/><path class="land" d="M-200 -200 L260 -200 C230 -40 330 40 250 140 C190 210 230 260 150 330 L-200 420Z"/>' +
          '<path class="land" d="M320 260 C360 240 420 280 420 320 L420 420 L300 420 C280 360 300 290 320 260Z"/><path class="cont" d="M-100 60 C40 20 120 90 180 40 M-120 160 C20 120 100 190 160 150"/></g>' +
          '<circle cx="200" cy="190" r="13" fill="#000"/><path d="M200 180 l7 16 -7 -4 -7 4z" fill="#fff" transform="rotate(' + S.env.heading + ' 200 190)"/></svg>' +
          '<div class="mscale">' + SCALES[map.zoom] + '</div>' + (map.panning ? '<div class="mpan">PAN</div>' : '') + '</div></div>';
      },
      onButton(b, long) {
        if (long) return false;
        if (map.panning) {
          if (b === 'up') map.panY += 30; else if (b === 'down') map.panY -= 30; else if (b === 'ok') map.panX -= 30; else if (b === 'back') map.panning = false;
          return true;
        }
        if (b === 'up') { map.zoom = Math.max(0, map.zoom - 1); return true; }
        if (b === 'down') { map.zoom = Math.min(SCALES.length - 1, map.zoom + 1); return true; }
        if (b === 'back') { nav.pop(); return true; }
        if (b === 'ok') { mapOptions(); return true; }
        return false;
      },
      onShow() { if (!S.env.compassCal) SN.ui.showToast('Calibrate compass', 2000); },
    };
    push(scr);
  }
  function mapOptions() {
    push(L({
      title: 'MAP OPTIONS',
      items: () => [
        { label: 'Map style', sub: S.settings.nav.mapStyle, onOk: () => push(radioList('Map style', [['Light', 'Light'], ['Dark', 'Dark'], ['High contrast', 'High contrast'], ['Winter', 'Winter']], () => S.settings.nav.mapStyle, (v) => { S.settings.nav.mapStyle = v; })) },
        { label: 'Pan map', onOk: () => { map.panning = true; nav.pop(); } },
        { label: 'Save position as POI', onOk: savePoi },
        { label: 'POIs', sub: S.settings.pois.length + '', onOk: poiList },
        { label: 'Navigation settings', onOk: navSettings },
      ],
    }));
  }
  const POI_TYPES = ['Start', 'End', 'Car', 'Parking', 'Home', 'Building', 'Hotel', 'Hostel', 'Accommodation', 'Sleeping spot', 'Camp', 'Camping', 'Campfire', 'Aid station', 'Emergency', 'Water point', 'Information', 'Restaurant', 'Food', 'Cafe', 'Cave', 'Mountain', 'Peak', 'Rock', 'Cliff', 'Avalanche', 'Valley', 'Hill', 'Road', 'Trail', 'River', 'Water', 'Waterfall', 'Coast', 'Lake', 'Kelp forest', 'Marine reserve', 'Coral reef', 'Big fish', 'Marine mammal', 'Wreck', 'Fishing spot', 'Beach', 'Forest', 'Meadow', 'Shore', 'Stand', 'Shot', 'Rub', 'Scrape', 'Big game', 'Small game', 'Bird', 'Tracks', 'Crossings', 'Danger', 'Geocache', 'Sight', 'Trailcam'];
  function savePoi() {
    push(new InfoScreen({
      content: () => '<div class="hdr"><div class="hdr-t">Save position as POI</div></div><div class="grid1">' + kv('Position', posStr()) + '</div><div class="donebtn">' + iconBox(I.check, 'green') + ' ' + esc(t('Save')) + '</div>',
      onOk: () => push(L({
        title: 'POI TYPE',
        items: POI_TYPES.map((ty) => ({ label: ty, onOk: () => {
          const n = S.settings.pois.filter((p) => p.type === ty).length + 1;
          S.settings.pois.push({ name: ty + ' ' + n, type: ty, created: S.now(), lat: S.env.lat, lon: S.env.lon, alt: 0 });
          S.save(); toast('Saved'); nav.popTo(nav.stack.length - 2);
        } })),
      })),
    }));
  }
  function poiList() {
    push(L({
      title: 'POIS',
      items: () => S.settings.pois.length ? S.settings.pois.map((p) => ({ label: p.name, sub: fmt.date(p.created), onOk: () => push(new InfoScreen({ content: () => '<div class="hdr"><div class="hdr-t">' + esc(p.name) + '</div></div><div class="grid1">' + kv('Type', p.type) + kv('Created', fmt.date(p.created) + ' ' + fmt.clock(p.created)) + kv('Latitude', p.lat.toFixed(5)) + kv('Longitude', p.lon.toFixed(5)) + kv('Altitude', p.alt + ' m') + '</div>' })) })) : [{ label: '- -', kind: 'info' }],
    }));
  }
  function navSettings() {
    push(L({
      title: 'NAVIGATION SETTINGS',
      items: () => {
        const nv = S.settings.nav;
        return [
          { label: 'Calibrate compass', onOk: () => push(new InfoScreen({ content: () => '<div class="cal big"><div class="calic">' + I.infinity + '</div><div>Rotate and tilt the device<br>in a figure-eight motion.</div></div>', onOk: () => { S.env.compassCal = true; toast('Done'); nav.pop(); }, onShow() {} })) },
          { label: 'Declination', sub: nv.declination.toFixed(1) + '°', onOk: () => {
            const vals = range(-30, 30, 0.5, 1);
            push(new PickerScreen({ title: 'Declination', final: 'check', cols: [{ values: vals, index: vals.indexOf(nv.declination), unit: '°', fmt: (v) => v.toFixed(1) }], onDone: (v) => { nv.declination = v[0]; nav.pop(); } }));
          } },
          { label: 'Compass unit', sub: nv.compassUnit === 'mil' ? 'Mils' : 'Degrees', onOk: () => push(radioList('Compass unit', [['deg', 'Degrees'], ['mil', 'Mils']], () => nv.compassUnit, (v) => { nv.compassUnit = v; })) },
          { label: 'Position format', sub: nv.posFormat, onOk: () => push(radioList('Position format', ['WGS84 Hd.d°', 'WGS84 Hd°m.m\'', 'WGS84 Hd°m\'s.s', 'UTM', 'MGRS', 'BNG (British)', 'ETRS-TM35FIN (Finnish)', 'KKJ (Finnish)', 'IG (Irish)', 'RT90 (Swedish)', 'SWEREF 99 TM (Swedish)', 'CH1903 (Swiss)', 'UTM NAD27 (Alaska)', 'UTM NAD27 Conus', 'UTM NAD83', 'NZTM2000 (New Zealand)'].map((x) => [x, x]), () => nv.posFormat, (v) => { nv.posFormat = v; })) },
        ];
      },
    }));
  }

  // =================== Wetter & Gezeiten (Kap. 12.3, 12.4) ===================
  function weather() {
    const w = S.env.weather;
    push(new InfoScreen({
      cls: 'tall',
      content: () => !S.env.app ? '<div class="hdr"><div class="hdr-t">WEATHER</div></div><div class="nodata">Sync with Suunto app</div>' :
        '<div class="hdr"><div class="hdr-t">WEATHER</div></div><div class="wbig">' + I.cloud + num(SN.U.temp(w.temp).v, SN.U.temp(0).u) + '</div><div class="grid2">' +
        kv('Wind', w.wind + ' m/s ' + ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(w.windDir / 45) % 8]) + kv('Gusts', w.gust + ' m/s') + kv('Humidity', w.hum + ' %') + kv('Precipitation', w.rain + ' mm') +
        kv('Sunrise', w.sunrise) + kv('Sunset', w.sunset) + kv('Moon phase', w.moon) + '</div><div class="sec">Forecast</div><div class="fc">' +
        w.forecast.map((x, i) => '<div><small>+' + (i + 1) * 3 + 'h</small><b>' + SN.U.temp(x).v + '°</b></div>').join('') + '</div>',
    }));
  }
  function tides() {
    const td = S.env.tides;
    push(new InfoScreen({
      cls: 'tall',
      content: () => {
        if (!S.env.app) return '<div class="hdr"><div class="hdr-t">TIDES</div></div><div class="nodata">Sync with Suunto app</div>';
        let path = '';
        for (let h = 0; h <= 24; h += 0.5) path += (h ? ' L' : 'M') + (20 + h * 23) + ' ' + (80 - Math.sin((h - 2) / 12.42 * 2 * Math.PI) * 50);
        return '<div class="hdr"><div class="hdr-t">TIDES</div></div><div class="wbig">' + I.wave + num(td.height.toFixed(1), 'm') + '</div><div class="grid2">' +
          kv('High tide', td.high.t + ' · ' + td.high.h + ' m') + kv('Low tide', td.low.t + ' · ' + td.low.h + ' m') + kv('Wave height', td.wave + ' m') + kv('Moon phase', td.moon) + '</div>' +
          '<div class="sec">24 h</div><svg class="prof" viewBox="0 0 600 160"><path d="' + path + '" fill="none" stroke="#19e6c8" stroke-width="3"/></svg><div class="grid1">' + kv('Position', posStr()) + '</div>';
      },
    }));
  }

  // =================== Ersteinrichtung (Kap. 2) ===================
  function setupWizard(done) {
    const step3 = () => push(L({
      title: 'UNITS',
      items: [
        { label: 'Metric', onOk: () => { Object.assign(S.settings.units, { system: 'metric', depth: 'm', pressure: 'bar', temp: 'C', volume: 'l' }); step4(); } },
        { label: 'Imperial', onOk: () => { Object.assign(S.settings.units, { system: 'imperial', depth: 'ft', pressure: 'psi', temp: 'F', volume: 'cuft' }); step4(); } },
      ],
    }));
    const step4 = () => push(L({
      title: 'Time format',
      items: [['24h', '24h'], ['12h', '12h']].map(([k, l]) => ({ label: l, onOk: () => { S.settings.timeFormat = k; S.settings.setupDone = true; S.save(); done(); } })),
    }));
    const warn = () => push(new InfoScreen({
      cls: 'tall',
      content: () => '<div class="cf"><div class="cf-ic warn">' + I.warn + '</div><div class="cf-t">WARNING</div><div class="cf-x left">' +
        'Dive computers are for trained divers only. Any computer can fail. Always use backup instruments and dive with a buddy.<br><br>' +
        'Read the printed quick guide and the online user guide of your dive computer.<br><br>' +
        '<small>(Gerätetext im Handbuch nicht abgedruckt – sinngemäß aus Kap. 1.1 übernommen)</small></div>' +
        '<div class="cf-b"><span class="ybtn">' + I.check + '</span>I understand</div></div>',
      onOk: step3,
      onBack: () => {},
    }));
    const lang = () => push(L({
      title: 'LANGUAGE', cls: 'lang',
      items: [['en', 'English'], ['de', 'Deutsch']].map(([k, l]) => ({ label: l, onOk: () => { S.settings.language = k; warn(); } })),
      onBack: () => {},
    }));
    push(new InfoScreen({
      cls: 'hello',
      content: () => '<div class="hello"><div class="hic">' + I.diver + '</div><div>Hello there!<br>Press the button to get started.</div><div class="harr">▾</div></div>',
      onOk: lang, onBack: () => {},
    }));
  }

  SN.screens = { diveSettings, diveMenu, widgets, controlPanel, deviceSettings, gases, logDetail, feeling, setupWizard, PasscodeScreen, mapWidget, softwareUpdate, diveHistory };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Gerätesteuerung: Tasten, Energiezustände, Sperren, Render-Schleife (Kap. 2.1, 3.3–3.5, 3.11, 3.15) */
(function (G) {
  'use strict';
  const SN = (G.SN = G.SN || {});
  const S = SN.state;
  const nav = SN.ui.nav;
  const esc = SN.esc;
  const t = (s) => SN.t(s);

  const LONG_MS = 900;          // Schwelle für langes Drücken (im Handbuch nicht angegeben)
  const RESET_MS = 12000;       // Kap. 3.15: alle vier Tasten 12 s
  const AOD_MS = 5 * 60e3, SLEEP_MS = 3600e3, DEEP_MS = 48 * 3600e3, LOCK_MS = 15 * 60e3;

  const app = {
    power: 'off',       // off | on | booting
    locked: false,      // Gerätesperre (Passcode)
    lastInput: 0,       // simulierte Zeit
    bootMsg: '',
    shakeUntil: 0,
  };
  SN.app = app;

  let screenEl, deviceEl;

  // ---------------- Tasten ----------------
  const ORIENT = { left: { up: 'up', back: 'back', down: 'down', ok: 'ok' }, right: { up: 'ok', back: 'down', down: 'back', ok: 'up' } };
  const held = new Map(); // logical -> {t0, longFired, timer}
  let resetTimer = null;

  function press(b) {
    if (held.has(b)) return;
    const h = { t0: Date.now(), longFired: false };
    h.timer = setTimeout(() => { h.longFired = true; handle(b, true); }, LONG_MS);
    held.set(b, h);
    markBtn(b, true);
    if (held.size === 4) {
      resetTimer = setTimeout(() => { held.forEach((x) => { x.longFired = true; }); softReset(); }, RESET_MS - LONG_MS);
    }
  }
  function release(b) {
    const h = held.get(b);
    if (!h) return;
    clearTimeout(h.timer);
    held.delete(b);
    markBtn(b, false);
    if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
    if (!h.longFired) handle(b, false);
  }
  function markBtn(b, on) {
    const el = document.querySelector('.btn[data-b="' + physFor(b) + '"]');
    if (el) el.classList.toggle('down', on);
  }
  function physFor(logical) {
    const m = ORIENT[S.settings.orientation];
    return Object.keys(m).find((k) => m[k] === logical);
  }

  function handle(b, long) {
    const live = SN.sim.live;
    const inDive = !!SN.sim.dive;
    if (app.power === 'booting') return;
    if (app.power === 'off') {
      // Tiefschlaf / aus: nur langes Drücken der oberen Taste weckt (Kap. 2, 3.5)
      if (b === 'up' && long) boot();
      return;
    }
    if (S.env.battery <= 0 && !S.env.charging) return;
    const wasAsleep = live.sleeping || live.aod;
    app.lastInput = S.now();
    if (wasAsleep) { wake(); live.wasSleeping = false; return; }

    // Alarme quittieren (auch bei Tastensperre)
    if (inDive) {
      const a = SN.alarms.ack();
      if (a) {
        if (a.id === 'gasswitch') SN.screens.diveMenu();
        return;
      }
    }
    // Tastensperre (Kap. 3.4)
    if (S.settings.buttonLock) {
      if (b === 'down' && long) { S.settings.buttonLock = false; SN.ui.showToast(esc(t('Buttons unlocked'))); S.save(); }
      else SN.ui.showToast(SN.ui.I.lock + ' ' + esc(t('Buttons locked')));
      return;
    }
    // Gerätesperre (Kap. 3.11)
    if (app.locked && !inDive) {
      if (!(nav.top() instanceof SN.screens.PasscodeScreen)) {
        askPasscode();
        return;
      }
    }
    const top = nav.top();
    if (top instanceof SN.screens.PasscodeScreen) { top.onButton(b, long); return; }
    if (long) {
      if (b === 'up') { S.settings.flashlight = !S.settings.flashlight; S.save(); return; }
      if (b === 'down') { S.settings.buttonLock = true; SN.ui.showToast(SN.ui.I.lock + ' ' + esc(t('Buttons locked'))); S.save(); return; }
    }
    if (top && top.onButton) top.onButton(b, long);
  }

  function askPasscode() {
    const pc = S.settings.passcode;
    nav.push(new SN.screens.PasscodeScreen({
      title: 'Enter passcode',
      onCode: (c) => {
        if (c === pc.code) { pc.fails = 0; app.locked = false; nav.pop(); S.save(); }
        else {
          pc.fails++;
          S.save();
          SN.ui.showToast('Wrong passcode (' + pc.fails + '/5)', 1500);
          if (pc.fails >= 5) {
            // Kap. 3.11: nach 5 Fehlversuchen muss das Gerät zurückgesetzt werden
            SN.ui.showToast('Too many attempts – device reset required', 3000);
            setTimeout(() => app.factoryReset(), 2500);
          }
        }
      },
    }));
  }

  // ---------------- Energiezustände ----------------
  function boot() {
    app.power = 'booting';
    app.bootMsg = '';
    setTimeout(() => {
      app.power = 'on';
      app.lastInput = S.now();
      SN.sim.live.sleeping = false; SN.sim.live.aod = false;
      nav.stack = [SN.face.Face];
      if (!S.settings.setupDone) SN.screens.setupWizard(() => nav.root());
      else if (S.settings.passcode.enabled) app.locked = true;
    }, 1800);
  }
  app.reboot = function (msg, after) {
    app.power = 'booting';
    app.bootMsg = msg || '';
    setTimeout(() => {
      if (after) after();
      app.bootMsg = '';
      setTimeout(() => {
        app.power = 'on'; app.lastInput = S.now();
        nav.stack = [SN.face.Face];
        if (!S.settings.setupDone) SN.screens.setupWizard(() => nav.root());
      }, 1500);
    }, msg ? 3500 : 0);
  };
  function softReset() {
    if (SN.sim.dive) { SN.ui.showToast('Never reset during a dive!', 2000); } // Kap. 3.15 Warnung – trotzdem wie Gerät
    app.reboot('', null);
  }
  app.factoryReset = function () {
    S.factoryReset();
    SN.alarms.clear();
    app.locked = false;
    app.applyOrientation();
    app.reboot('', null);
  };
  function wake() {
    const l = SN.sim.live;
    if (l.sleeping) l.wasSleeping = true;
    l.sleeping = false; l.aod = false;
    app.lastInput = S.now();
  }
  app.wake = wake;
  app.raiseWrist = function () { if (SN.sim.live.aod) wake(); };

  function powerTick() {
    const l = SN.sim.live;
    if (app.power !== 'on') return;
    if (!app.lastInput) app.lastInput = S.now();
    if (S.env.battery <= 0 && !S.env.charging) { app.power = 'off'; nav.stack = [SN.face.Face]; return; }
    if (SN.sim.dive || l.wet) { if (l.sleeping || l.aod) wake(); app.lastInput = Math.max(app.lastInput, S.now() - 1000); return; }
    const idle = S.now() - app.lastInput;
    if (S.env.battery < 2 && !S.env.charging) l.sleeping = true; // sehr niedriger Akku -> Ruhemodus
    if (idle > DEEP_MS) { app.power = 'off'; l.sleeping = false; l.aod = false; return; }
    if (idle > SLEEP_MS) { l.sleeping = true; l.aod = false; }
    else if (idle > AOD_MS) { if (!l.sleeping) l.aod = true; }
    if (S.settings.passcode.enabled && (idle > LOCK_MS || l.sleeping) && !app.locked) app.locked = true;
  }

  // ---------------- Tauchgang-Ereignisse ----------------
  app.onDiveStart = function () {
    // Auto-Start aus jeder Ansicht in den Tauchzustand (Kap. 4.2); Gerätesperre wird aufgehoben (Kap. 3.11)
    app.locked = false;
    nav.stack = [SN.face.Face];
    wake();
    SN.sim.live.gpsSearchStart = 0;
  };
  app.onDiveEnd = function (log, wasLocked) {
    nav.stack = [SN.face.Face];
    const show = () => SN.screens.logDetail(log);
    if (S.mode().extra.feeling) SN.screens.feeling(log, show); else show();
    if (wasLocked || S.settings.passcode.enabled && wasLocked) app.locked = true;
  };
  app.openWidgets = function () { SN.screens.widgets(); };
  app.cycleBrightness = function () {
    const o = ['low', 'medium', 'high'];
    S.settings.brightness = o[(o.indexOf(S.settings.brightness) + 1) % 3];
    SN.ui.showToast(SN.ui.I.sun + ' ' + esc(t('Brightness')) + ': ' + esc(t({ low: 'Low', medium: 'Medium', high: 'High' }[S.settings.brightness])));
    S.save();
  };
  app.shake = function () { app.shakeUntil = Date.now() + 500; };
  app.applyOrientation = function () {
    if (deviceEl) deviceEl.classList.toggle('flip', S.settings.orientation === 'right');
  };

  // ---------------- Rendern ----------------
  function render() {
    const l = SN.sim.live;
    let html;
    const scr = document.getElementById('screen');
    scr.className = 'screen b-' + S.settings.brightness + (l.aod ? ' aod' : '');
    if (app.power === 'off') {
      html = S.env.charging ? chargingHtml() : '<div class="scr black"></div>';
    } else if (app.power === 'booting') {
      html = '<div class="scr boot"><div class="logo"><span class="tri"></span>SUUNTO</div>' + (app.bootMsg ? '<div class="bootmsg">' + esc(app.bootMsg) + '<div class="prog"><i></i></div></div>' : '') + '</div>';
    } else if (l.sleeping) {
      html = (S.env.charging || S.env.battery < 2) ? chargingHtml() : '<div class="scr black"></div>';
    } else {
      const top = nav.top() || SN.face.Face;
      html = top.render() + SN.ui.toastHtml();
    }
    screenEl.innerHTML = html;
    const top = nav.top();
    if (top && top.afterRender && app.power === 'on') top.afterRender(screenEl);

  function chargingHtml() {
    return '<div class="scr charging"><div class="bigbat"><i style="width:' + Math.round(S.env.battery) + '%"></i></div><div class="cpct">' + SN.ui.I.plug + ' ' + Math.round(S.env.battery) + ' %</div></div>';
  }

  // ---------------- Eingaben ----------------
  const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Enter: 'ok', KeyD: 'ok', Space: 'ok', Backspace: 'back', Escape: 'back', KeyA: 'back' };
  function bindInput() {
    document.addEventListener('keydown', (e) => {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      const b = KEYS[e.code];
      if (!b) return;
      e.preventDefault();
      if (!e.repeat) press(b);
    });
    document.addEventListener('keyup', (e) => {
      const b = KEYS[e.code];
      if (b) { e.preventDefault(); release(b); }
    });
    document.querySelectorAll('.btn').forEach((el) => {
      const phys = el.dataset.b;
      const logical = () => ORIENT[S.settings.orientation][phys];
      let lg = null;
      const down = (e) => { e.preventDefault(); lg = logical(); press(lg); el.setPointerCapture && e.pointerId != null && el.setPointerCapture(e.pointerId); };
      const up = (e) => { e.preventDefault(); if (lg) release(lg); lg = null; };
      el.addEventListener('pointerdown', down);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('contextmenu', (e) => e.preventDefault());
    });
    // Wischen nach oben auf dem Oberflächen-Display -> Systemsteuerung (Kap. 3)
    let sy = null;
    screenEl.addEventListener('pointerdown', (e) => { sy = e.clientY; });
    screenEl.addEventListener('pointerup', (e) => {
      if (sy == null) return;
      const dy = sy - e.clientY; sy = null;
      if (S.settings.orientation === 'right') return;
      if (dy > 40 && app.power === 'on' && !SN.sim.dive && nav.stack.length === 1 && !S.settings.buttonLock && !app.locked) {
        app.lastInput = S.now(); SN.screens.controlPanel();
      }
    });
  }

  function fit() {
    const wrap = document.getElementById('devwrap');
    const W = 980, H = 720;
    const narrow = window.innerWidth <= 1100;
    const avail = Math.min(wrap.clientWidth / W, narrow ? 1.2 : (window.innerHeight - 20) / H, 1.2);
    deviceEl.style.transform = 'scale(' + Math.max(0.3, avail) + ')';
    wrap.style.height = H * Math.max(0.3, avail) + 'px';
  }

  function init() {
    screenEl = document.getElementById('screen');
    deviceEl = document.getElementById('device');
    const had = S.load();
    if (had) {
      // seit dem letzten Speichern vergangene Zeit an der Oberfläche nachholen
      const gap = (Date.now() - S.savedAt) / 1000;
      SN.sim.fastForward(gap);
    }
    nav.stack = [SN.face.Face];
    app.applyOrientation();
    bindInput();
    fit();
    window.addEventListener('resize', fit);
    if (had && S.settings.setupDone) { app.power = 'on'; app.lastInput = S.now(); if (S.settings.passcode.enabled) app.locked = true; }
    let last = performance.now();
    let saveT = 0;
    setInterval(() => {
      const now = performance.now();
      const dt = Math.min(0.5, (now - last) / 1000);
      last = now;
      if (app.power === 'on' || app.power === 'off') SN.sim.tick(dt);
      SN.alarms.update();
      powerTick();
      render();
      if (SN.debug) SN.debug.refresh();
      saveT += dt;
      if (saveT > 5) { saveT = 0; S.save(); }
    }, 100);
    window.addEventListener('beforeunload', () => S.save());
  }
  app.press = press; app.release = release; app.boot = boot;
  app.tap = function (b, long) { if (long) { handle(b, true); } else handle(b, false); };
  document.addEventListener('DOMContentLoaded', init);
})(typeof window !== 'undefined' ? window : globalThis);

        slider('AMV (Oberfläche)', 5, 60, 1, () => env.sac, (v) => { env.sac = v; }, 'l/min'),
        select('Sidemount: atmen aus', [['0', 'Flasche 1'], ['1', 'Flasche 2']], () => String(env.breatheFrom), (v) => { env.breatheFrom = parseInt(v, 10); }),
        ...env.pods.map((p, i) => h('div', { cls: 'pod' }, h('b', {}, 'POD ' + (i + 1) + ' · ' + p.serial),
          slider('Druck', 0, 300, 1, () => p.pressure, (v) => { p.pressure = v; }, 'bar'),
          check('aktiv (sendet)', () => p.active, (v) => { p.active = v; }),
          check('in Reichweite / Ventil offen', () => p.inRange, (v) => { p.inRange = v; }),
          check('Akku schwach', () => p.battery === 'low', (v) => { p.battery = v ? 'low' : 'ok'; })))),
      section('Szenarien', true,
        h('div', { cls: 'scen' }, ...SCENARIOS.map((sc) => h('div', { cls: 'sc' }, btn(sc.name, () => runScenario(sc)), h('small', {}, sc.desc)))),
        btns(btn('Szenario stoppen', stopScenario, 'warn')),
        h('p', { cls: 'hint' }, 'Szenarien setzen Gase/Modus des Geräts passend und laufen im Zeitraffer. Danach Tiefe/Zeitraffer frei weiter steuerbar.')),
      section('Wetter & Gezeiten (App-Daten)', false,
        slider('Temperatur', -20, 40, 1, () => env.weather.temp, (v) => { env.weather.temp = v; }, '°C'),
        slider('Wind', 0, 30, 1, () => env.weather.wind, (v) => { env.weather.wind = v; }, 'm/s'),
        slider('Gezeitenhöhe', -2, 4, 0.1, () => env.tides.height, (v) => { env.tides.height = v; }, 'm'),
        slider('Wellenhöhe', 0, 5, 0.1, () => env.tides.wave, (v) => { env.tides.wave = v; }, 'm')),
    );
  }
  function alt(m) { return +(1.01325 * Math.pow(1 - 2.25577e-5 * m, 5.25588)).toFixed(3); }
  function skip(sec) {
    if (SN.sim.dive) { // im Tauchgang: in 1-s-Schritten simulieren
      const n = Math.min(sec, 7200);
      for (let i = 0; i < n; i++) SN.sim.tick(1 / S.env.timeScale);
      return;
    }
    S.simOffset += sec * 1000;
    SN.sim.fastForward(sec);
  }
  function pairApp() {
    const bt = S.settings.bt;
    if (bt.airplane) { SN.ui.showToast('Airplane mode', 2000); return; }
    if (!bt.discovery) { SN.ui.showToast('Discovery off', 2000); return; }
    const code = String(Math.floor(100000 + Math.random() * 900000));
    SN.app.wake();
    SN.ui.showToast('Pairing code<br><b style="font-size:54px">' + code + '</b>', 6000);
    setTimeout(() => { S.env.app = true; }, 4000);
  }

  function refresh() {
    scenTick();
    const lv = document.getElementById('dbg-live');
    if (lv && lv.closest('details').open) lv.innerHTML = liveText();
    for (const b of binds) {
      if (document.activeElement === b.el) continue;
      const v = b.get();
      if (b.isCheck) b.el.checked = !!v;
      else if (b.isSel) b.el.value = v;
      else if (b.isNum) b.el.value = v;
      else { b.el.value = v; if (b.out) b.out.textContent = (b.step < 1 ? (+v).toFixed(1) : Math.round(v)) + ' ' + (b.unit || ''); }
    }
    document.querySelectorAll('#debug .ts').forEach((e) => e.classList.toggle('on', e.textContent === S.env.timeScale + '×'));
  }

  SN.debug = { refresh, runScenario, SCENARIOS };
  document.addEventListener('DOMContentLoaded', build);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
