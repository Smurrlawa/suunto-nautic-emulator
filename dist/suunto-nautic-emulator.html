<style>

<script>
/*
 * Bühlmann ZHL-16C mit Gradientenfaktoren, CNS/OTU.
 * Handbuch Kap. 8: "Suunto Bühlmann 16 GF basierend auf ZHL-16C".
 * Die Suunto-eigene Implementierung ist nicht öffentlich – dies ist eine
 * Standard-Implementierung (Schreiner-Gleichung, GF-Interpolation nach Baker).
 */
(function (G) {
  'use strict';
  const SN = (G.SN = G.SN || {});

  const PH2O = 0.0627; // Wasserdampfdruck in der Lunge (bar)
  const LN2 = Math.LN2;

  // ZHL-16C (Kompartiment 1 = "1b", 5 min)
  const N2_HT = [5.0, 8.0, 12.5, 18.5, 27.0, 38.3, 54.3, 77.0, 109, 146, 187, 239, 305, 390, 498, 635];
  const N2_A = [1.1696, 1.0, 0.8618, 0.7562, 0.62, 0.5043, 0.441, 0.4, 0.375, 0.35, 0.3295, 0.3065, 0.2835, 0.261, 0.248, 0.2327];
  const N2_B = [0.5578, 0.6514, 0.7222, 0.7825, 0.8126, 0.8434, 0.8693, 0.891, 0.9092, 0.9222, 0.9319, 0.9403, 0.9477, 0.9544, 0.9602, 0.9653];
  const HE_HT = [1.88, 3.02, 4.72, 6.99, 10.21, 14.48, 20.53, 29.11, 41.2, 55.19, 70.69, 90.34, 115.29, 147.42, 188.24, 240.03];
  const HE_A = [1.6189, 1.383, 1.1919, 1.0458, 0.922, 0.8205, 0.7305, 0.6502, 0.595, 0.5545, 0.5333, 0.5189, 0.5181, 0.5176, 0.5172, 0.5119];
  const HE_B = [0.477, 0.5747, 0.6527, 0.7223, 0.7582, 0.7957, 0.8279, 0.8553, 0.8757, 0.8903, 0.8997, 0.9073, 0.9122, 0.9171, 0.9217, 0.9267];
  const N = 16;

  class Tissues {
    constructor(src) {
      this.n2 = new Array(N);
      this.he = new Array(N);
      if (src) {
        for (let i = 0; i < N; i++) { this.n2[i] = src.n2[i]; this.he[i] = src.he[i]; }
      } else this.reset(1.01325);
    }
    reset(psurf) {
      for (let i = 0; i < N; i++) { this.n2[i] = (psurf - PH2O) * 0.7902; this.he[i] = 0; }
    }
    clone() { return new Tissues(this); }
    toJSON() { return { n2: this.n2.slice(), he: this.he.slice() }; }

    /**
     * Schreiner-Gleichung. p0: Umgebungsdruck am Anfang (bar), rate: bar/min,
     * tMin: Dauer in Minuten, gas: {o2, he} in Prozent.
     */
    load(p0, rate, tMin, gas) {
      if (tMin <= 0) return;
      const fHe = gas.he / 100;
      const fN2 = 1 - gas.o2 / 100 - fHe;
      const piN2 = Math.max(0, p0 - PH2O) * fN2, rN2 = rate * fN2;
      const piHe = Math.max(0, p0 - PH2O) * fHe, rHe = rate * fHe;
      for (let i = 0; i < N; i++) {
        let k = LN2 / N2_HT[i];
        this.n2[i] = piN2 + rN2 * (tMin - 1 / k) - (piN2 - this.n2[i] - rN2 / k) * Math.exp(-k * tMin);
        k = LN2 / HE_HT[i];
        this.he[i] = piHe + rHe * (tMin - 1 / k) - (piHe - this.he[i] - rHe / k) * Math.exp(-k * tMin);
      }
    }

    /** tolerierter Umgebungsdruck je Kompartiment für einen GF (0..1) */
    tolerated(gf) {
      let max = 0;
      for (let i = 0; i < N; i++) {
        const p = this.n2[i] + this.he[i];
        const a = (N2_A[i] * this.n2[i] + HE_A[i] * this.he[i]) / p;
        const b = (N2_B[i] * this.n2[i] + HE_B[i] * this.he[i]) / p;
        const tol = (p - a * gf) / (gf / b + 1 - gf);
        if (tol > max) max = tol;
      }
      return max;
    }

    /** M-Wert (GF 100) für ein Kompartiment bei Umgebungsdruck pamb */
    mValue(i, pamb) {
      const p = this.n2[i] + this.he[i];
      const a = p > 0 ? (N2_A[i] * this.n2[i] + HE_A[i] * this.he[i]) / p : N2_A[i];
      const b = p > 0 ? (N2_B[i] * this.n2[i] + HE_B[i] * this.he[i]) / p : N2_B[i];
      return a + pamb / b;
    }

    /** aktueller Gradientfaktor (GF99) in % bei pamb */
    gfNow(pamb) {
      let max = -Infinity;
      for (let i = 0; i < N; i++) {
        const p = this.n2[i] + this.he[i];
        const m = this.mValue(i, pamb);
        const gf = (p - pamb) / (m - pamb);
        if (gf > max) max = gf;
      }
      return max * 100;
    }

    /** Daten für Gewebediagramm: Anteil Gewebedruck/Umgebungsdruck, M-Wert-Überschreitung */
    chart(pamb) {
      const out = [];
      for (let i = 0; i < N; i++) {
        const p = this.n2[i] + this.he[i];
        out.push({ ratio: p / pamb, overM: p > this.mValue(i, pamb), overAmb: p > pamb });
      }
      return out;
    }
  }

  /**
   * Umrechnung Tiefe <-> Druck. env = {psurf (bar), rho (kg/m³)}
   */
  function pAt(depth, env) { return env.psurf + Math.max(0, depth) * env.rho * 9.80665e-5; }
  function dAt(p, env) { return (p - env.psurf) / (env.rho * 9.80665e-5); }

  function gfAt(depth, anchor, gfLow, gfHigh) {
    if (anchor <= 0) return gfHigh;
    if (depth >= anchor) return gfLow;
    return gfHigh + (gfLow - gfHigh) * depth / anchor;
  }

  /** Ceiling-Tiefe (m) mit GF-Interpolation; 0 wenn keine */
  function ceiling(t, env, anchor, gfLow, gfHigh, algoSurf) {
    const ps = algoSurf != null ? algoSurf : env.psurf;
    const tolHigh = t.tolerated(gfHigh);
    if (tolHigh <= ps) return 0;
    // von flach nach tief suchen: erste Tiefe, an der Gewebe toleriert werden
    const maxD = Math.max(anchor, dAt(t.tolerated(gfLow), env)) + 1;
    for (let d = 0; d <= maxD; d += 0.1) {
      const gf = gfAt(d, anchor, gfLow, gfHigh);
      if (t.tolerated(gf) <= pAt(d, env) - (env.psurf - ps)) return Math.round(d * 10) / 10;
    }
    return Math.round(maxD * 10) / 10;
  }

  // MOD wie in den Screenshots: AIR/1.4 => 56.7 m, NX32/1.4 => 33.8 m, NX50/1.6 => 22 m
  function mod(gas) {
    return (gas.ppo2 / (gas.o2 / 100) - 1) * 10;
  }

  /** bestes Gas für eine Tiefe (höchster O2-Anteil innerhalb der MOD) */
  function bestGas(gases, depth) {
    let best = null;
    for (const g of gases) {
      if (mod(g) + 0.05 >= depth && (!best || g.o2 > best.o2)) best = g;
    }
    return best;
  }

  /** Nullzeit in Minuten (max 100 => ">99"). 0 => Deko */
  function ndl(t, env, depth, gas, gfHigh, algoSurf) {
    const ps = algoSurf != null ? algoSurf : env.psurf;
    if (t.tolerated(gfHigh) > ps) return 0;
    const c = t.clone();
    const p = pAt(depth, env);
    for (let m = 1; m <= 100; m++) {
      c.load(p, 0, 1, gas);
      if (c.tolerated(gfHigh) > ps) return m - 1;
    }
    return 100;
  }

  /**
   * Aufstiegsplan ab aktueller Tiefe.
   * opts: {env, gases (verfügbar), gas (aktiv), gfLow, gfHigh, anchor, lastStop (3|6),
   *        stepped (bool), rate (m/min, 10), safety: {mode, remaining (s)} , algoSurf}

  function plan(t0, depth, opts) {

    const gfL = opts.gfLow, gfH = opts.gfHigh;
    const t = t0.clone();
    const ps = opts.algoSurf != null ? opts.algoSurf : env.psurf;

    let gas = opts.gas;
    const multi = opts.gases && opts.gases.length > 1;
    let anchor = Math.max(opts.anchor || 0, dAt(t.tolerated(gfL) + off, env));
    const segments = [];
    let time = 0;
    let d = depth;

    const ascend = (to) => {
      while (d > to + 1e-6) {
        // in 3-m-Abschnitten aufsteigen, um Gaswechsel zu erkennen
        const next = Math.max(to, Math.ceil(d / 3 - 1e-6) * 3 - 3);
        const tgt = Math.max(to, next);
        const dt = (d - tgt) / rate;
        const p0 = pAt(d, env), p1 = pAt(tgt, env);
        t.load(p0, (p1 - p0) / dt, dt, gas);
        time += dt;
        d = tgt;
        if (multi) {
          const bg = bestGas(opts.gases, d);
          if (bg && bg.o2 > gas.o2) { gas = bg; segments.push({ type: 'switch', depth: d, gas, run: time }); }
        }
      }
    };

    const tol = (gf) => t.tolerated(gf);
    let stops = [];
    if (tol(gfH) > ps) {
      // Deko erforderlich
      let firstStop = Math.max(opts.lastStop, Math.ceil(anchor / 3 - 1e-6) * 3);
      if (firstStop > d) firstStop = Math.max(opts.lastStop, Math.floor(d / 3) * 3);
      let stop = firstStop;
      if (d > stop) ascend(stop);
      let guard = 0;
      while (stop > 0 && guard++ < 2000) {
        const next = stop <= opts.lastStop ? 0 : stop - 3;
        const gfN = gfAt(next, anchor, gfL, gfH);
        let st = 0;
        const p = pAt(stop, env);
        while (tol(gfN) > pAt(next, env) - off && st < 999) {
          t.load(p, 0, 1 / 6, gas); st += 1 / 6; time += 1 / 6;
        }
        if (st > 0) stops.push({ depth: stop, time: st, gas, run: time });
        if (next === 0) break;
        ascend(next);
        stop = next;
      }
      d = Math.min(d, stop);
    }
    // Sicherheitsstopp im TTS nur bei "Eingestellt"
    let safetyAdd = 0;
    if (opts.safety && opts.safety.mode === 'adjusted' && opts.safety.remaining > 0) {
      safetyAdd = opts.safety.remaining / 60;
    }
    ascend(0);
    time += safetyAdd;

  }

  // NOAA CNS-Grenzwerte (Minuten) je ppO2
  const CNS_TAB = [[0.6, 720], [0.7, 570], [0.8, 450], [0.9, 360], [1.0, 300], [1.1, 240], [1.2, 210], [1.3, 180], [1.4, 150], [1.5, 120], [1.6, 45]];
  function cnsPerMin(ppo2) {
    if (ppo2 < 0.5) return 0;
    const p = Math.min(ppo2, 1.6); // Handbuch: "CNS% ist auf 1,6 bar begrenzt"
    if (p <= 0.6) return 100 / 720;
    for (let i = 1; i < CNS_TAB.length; i++) {
      if (p <= CNS_TAB[i][0]) {
        const [p0, l0] = CNS_TAB[i - 1], [p1, l1] = CNS_TAB[i];
        const lim = l0 + (l1 - l0) * (p - p0) / (p1 - p0);
        return 100 / lim;
      }
    }
    return 100 / 45;
  }
  function otuPerMin(ppo2) {
    if (ppo2 <= 0.5) return 0;
    return Math.pow((ppo2 - 0.5) / 0.5, 0.83);
  }

  SN.Deco = { Tissues, PH2O, pAt, dAt, gfAt, ceiling, ndl, plan, mod, bestGas, cnsPerMin, otuPerMin, N };

<script>
/* Simulation: Umgebung -> Sensorwerte -> Tauchgangslogik (Kap. 4, 6, 7, 8, 9, 11) */
(function (G) {

    ndl: 100, tts: 0, ceiling: 0, inDeco: false, stopDepth: 0, stopTime: 0, plan: null,

  let lastDecoCalc = 0;
  let prevDepth = 0;

  function modeNow() { return S.mode(); }
  function algoEnv() { return { psurf: S.env.psurf, rho: S.waterRho() }; }

  /** Flaschendruck für Gas (verbundene PODs) */
  function podsFor(gas) {

    const out = [];

      if (!serial) return;

      out.push({ slot, serial, pod: p, data: !!(p && p.inRange && p.active), pressure: p ? p.pressure : null });

  function totalCNS() { return S.cns; }
  function dailyOTU() {
    const now = S.now();

  function startDive() {

      anchor: 0, everDeco: false, decoEnteredAlarm: false,
      safety: { required: false, remaining: 0, total: 0, started: false, done: false, shallowDeco: 0 },
      brokenSince: null, deviation: S.deviationUntil > now, otu: 0,

  function endDive() {

      const pods = podsFor(g);
      const avg = u.rmv && u.rmv.length ? u.rmv.reduce((a, b) => a + b, 0) / u.rmv.length : null;
      return {
        name: SN.fmt.gasName(g), o2: g.o2, he: g.he, ppo2: g.ppo2, tank: g.tank, active: g.state === 'active',
        startP: u.start && u.start.filter((x) => x != null), endP: pods.filter((p) => p.data).map((p) => p.pressure), avgRmv: avg,

    const log = {
      id: Date.now(), n: S.logs.length + 1, start: dive.start, end, duration: (end - dive.start) / 1000,
      maxDepth: dive.maxDepth, avgDepth: dive.depthTime ? dive.depthSum / dive.depthTime : 0,
      samples: dive.samples, tempMin: dive.tempMin, tempMax: dive.tempMax, tempAvg: dive.tempN ? dive.tempSum / dive.tempN : null,
      gases: gasList, gf: Object.assign({}, S.gf(m)), algoOn: m.algo.enabled, cns: Math.ceil(S.cns), otu: Math.ceil(dive.otu),

  // Entsättigungszeit (s): bis alle Kompartimente nahezu im Gleichgewicht (Annahme: < 0,03 bar Übersättigung)
  function desatTime(t) {
    const ps = S.env.psurf;
    const eq = (ps - D.PH2O) * 0.7902;

  }
  // Kap. 11.1: min. 12 h bzw. Entsättigungszeit; < 75 min -> keine; Algorithmusabweichung -> 48 h
  function noFlyFor(desat, deviation) {
    if (deviation) return 48 * 3600;
    if (desat < 75 * 60) return 0;
    return Math.max(12 * 3600, desat);
  }
  function noFlyRemaining() {
    const last = S.logs[S.logs.length - 1];
    if (!last) return 0;
    const rem = last.noFly - (S.now() - last.end) / 1000;
    return Math.max(0, rem);
  }

  /** ein Simulationsschritt, dt in Sekunden (<= 1) */
  function step(dt) {
    const env = S.env;
    const m = modeNow();
    // Tiefensteuerung
    if (env.depth !== env.targetDepth) {
      const dz = env.rate / 60 * dt;
      if (Math.abs(env.targetDepth - env.depth) <= dz) env.depth = env.targetDepth;
      else env.depth += Math.sign(env.targetDepth - env.depth) * dz;
    }
    env.depth = Math.max(0, env.depth);
    const wet = env.wetMode === 'dry' ? false : env.wetMode === 'wet' ? true : env.depth > 0.05;
    live.wet = wet;
    const pamb = env.psurf + env.depth * env.rho * 9.80665e-5;
    live.pamb = pamb;
    live.rawDepth = env.depth;
    const d = dispDepth(pamb);
    live.depth = d;
    // Temperatur: im Wasser Wassertemperatur, sonst Luft (Sensor träge)
    const tt = wet ? env.tempWater : env.tempAir;
    live.temp += (tt - live.temp) * Math.min(1, dt / 30);

    // Aufstiegsgeschwindigkeit (geglättet)

    prevDepth = d;
    live.ascRate += (inst - live.ascRate) * Math.min(1, dt / 2);

    // Tauchgang starten/beenden (Kap. 4.2)

    const thr = wet ? sd : sd + 1.8;
    if (!dive && d >= thr && !(SN.app && SN.app.power === 'off')) startDive();

    const gas = dive ? S.activeGas(m) : { o2: 21, he: 0 };
    S.tissues.load(pamb, 0, dt / 60, gas);

  function diveStep(dt, d, pamb, gas, m, thr) {

  function calcGas(gas) {
    live.rmv = null; live.gasTime = null;

    }

  function tick(realDt) {
    const scale = S.env.timeScale || 1;

    }

  function fastForward(sec) {
    if (sec <= 0) return;

  }

  function setDepthNow(dm) { S.env.depth = dm; S.env.targetDepth = dm; prevDepth = dispDepth(S.env.psurf + dm * S.env.rho * 9.80665e-5); }

  SN.sim = {
    live, tick, fastForward, podsFor, dailyOTU, totalCNS, noFlyRemaining, desatTime, setDepthNow,
    get dive() { return dive; },
    dismissSuggestion() { if (dive && dive.suggest) { dive.dismissed = dive.suggest.id; dive.suggest = null; } },
    switchGas(g) {
      const m = modeNow();

<script>
/* Tauchalarme (Kap. 7): obligatorische + benutzerkonfigurierbare, Töne, Vibration */
(function (G) {
  'use strict';
  const SN = (G.SN = G.SN || {});
  const S = SN.state;
  const L = () => SN.sim.live;

  // level: warning (rot), caution (gelb), notify (cyan)
  // Priorität: Reihenfolge der Liste (Warnungen zuerst)
  function mandatory() {
    const l = L(), dv = SN.sim.dive, m = S.mode();
    if (!dv) return [];
    const gas = S.activeGas(m);
    const pods = SN.sim.podsFor(gas).filter((p) => p.data);
    const minP = pods.length ? Math.min(...pods.map((p) => p.pressure)) : null;
    const out = [];
    const push = (id, level, cond, extra) => { if (cond) out.push(Object.assign({ id, level }, extra || {})); };
    // Kap. 9.2: rote Warnung bleibt, bis die Dekostopps durchgeführt wurden
    push('deviation', 'warning', dv.deviation && l.inDeco, { takeover: 'deviation' });
    push('ascent', 'warning', l.ascFastSince != null && dv.runtime - l.ascFastSince >= 5, { field: 'asc' });
    push('ceiling', 'warning', l.above === 'broken', { field: 'stop' });
    push('ppo2max', 'warning', l.ppo2 > 1.6, { field: 'ppo2' });
    push('cns100', 'warning', S.cns >= 100, { field: 'cns' });
    push('otu300', 'warning', SN.sim.dailyOTU() >= 300, { field: 'otu' });
    push('tank50', 'warning', minP != null && minP < 50, { takeover: 'tank', field: 'tank' });
    push('ppo2set', 'caution', l.ppo2 > gas.ppo2 && l.ppo2 <= 1.6, { field: 'ppo2' });
    push('cns80', 'caution', S.cns >= 80 && S.cns < 100, { field: 'cns' });
    push('otu250', 'caution', SN.sim.dailyOTU() >= 250 && SN.sim.dailyOTU() < 300, { field: 'otu' });
    push('safetywin', 'caution', dv.safety.started && !dv.safety.done && l.depth < 2.4 && dv.surfacedAt == null, { field: 'stop' });
    push('ndl5', 'caution', m.algo.enabled && l.ndl != null && l.ndl > 0 && l.ndl <= 5, { field: 'deco' });
    push('deco', 'caution', m.algo.enabled && l.inDeco, { field: 'deco', ackOnly: true });
    push('gasswitch', 'notify', !!dv.suggest, { takeover: 'gasswitch' });
    return out;
  }

  // Benutzeralarme: lösen einmalig aus, wenn die Schwelle erreicht wird
  function user() {
    const l = L(), dv = SN.sim.dive, m = S.mode();
    if (!dv) return [];
    const a = m.alarms;
    const gas = S.activeGas(m);
    const pods = SN.sim.podsFor(gas).filter((p) => p.data);
    const out = [];
    a.depth.forEach((x, i) => { if (x.on !== false && l.depth >= x.v) out.push({ id: 'u-depth-' + i, level: x.look, field: 'depth', cfg: x, user: true }); });
    a.time.forEach((x, i) => { if (x.on !== false && dv.runtime >= x.v) out.push({ id: 'u-time-' + i, level: x.look, field: 'time', cfg: x, user: true }); });
    a.ndl.forEach((x, i) => { if (x.on !== false && l.ndl != null && l.ndl > 0 && l.ndl <= x.v) out.push({ id: 'u-ndl-' + i, level: x.look, field: 'deco', cfg: x, user: true }); });
    if (pods.length) {
      const minP = Math.min(...pods.map((p) => p.pressure));
      a.tank.forEach((x, i) => { if (x.on !== false && minP <= x.v) out.push({ id: 'u-tank-' + i, level: x.look, takeover: 'tank', cfg: x, user: true }); });
      if (pods.length > 1) {
        const diff = Math.abs(pods[0].pressure - pods[1].pressure);
        a.sidemount.forEach((x, i) => { if (x.on !== false && diff >= x.v) out.push({ id: 'u-side-' + i, level: x.look, takeover: 'sidemount', cfg: x, user: true }); });
      }
    }
    if (l.gasTime != null) a.gastime.forEach((x, i) => { if (x.on !== false && l.gasTime <= x.v) out.push({ id: 'u-gastime-' + i, level: x.look, takeover: 'gastime', cfg: x, user: true }); });
    return out;
  }

  const active = new Map(); // id -> {def, acked, since}
  const fired = new Set();  // Benutzeralarme, die bereits ausgelöst haben
  let audioCtx = null;
  let lastBeep = 0;

  function beep(pattern) {
    const m = S.mode();
    if (m.alarms.muteAudio) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      let t = audioCtx.currentTime;
      for (const [dur, gap, f] of pattern) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = f || 3100;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.01);
        g.gain.setValueAtTime(0.08, t + dur - 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
        t += dur + gap;
      }
    } catch (e) { /* kein Audio */ }
  }
  function vibrate(ms) {
    const m = S.mode();
    if (m.alarms.muteVib) return;
    if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) { /* */ }
    if (SN.app) SN.app.shake();
  }

  function signal(def) {
    const cfg = def.cfg;
    if (cfg) {
      if (cfg.audio !== false) beep(cfg.tone === 'long' ? [[0.6, 0.1, 2900]] : [[0.12, 0.08, 3100], [0.12, 0, 3100]]);
      if (cfg.vib !== false) vibrate(cfg.tone === 'long' ? 600 : 250);
      return;
    }
    if (def.level === 'warning') { beep([[0.15, 0.06], [0.15, 0.06], [0.15, 0.06], [0.4, 0]]); vibrate([200, 80, 200, 80, 400]); }
    else if (def.level === 'caution') { beep([[0.2, 0.1], [0.2, 0]]); vibrate([200, 100, 200]); }
    else { beep([[0.15, 0]]); vibrate(150); }
  }

  function update() {
    const defs = mandatory().concat(user());
    const ids = new Set(defs.map((d) => d.id));
    for (const def of defs) {
      if (def.user && fired.has(def.id) && !active.has(def.id)) continue;
      if (!active.has(def.id)) {
        active.set(def.id, { def, acked: false, since: Date.now() });
        if (def.user) fired.add(def.id);
        signal(def);
        if (SN.app) SN.app.wake();
      } else active.get(def.id).def = def;
    }
    for (const [id, a] of active) {
      if (!ids.has(id)) {
        // Benutzeralarme bleiben bis zur Quittierung sichtbar; obligatorische verschwinden bei Auflösung
        if (a.def.user && !a.acked) continue;
        active.delete(id);
      }
    }
    // Benutzeralarme dürfen erneut auslösen, wenn Bedingung zurückgesetzt ist
    for (const id of Array.from(fired)) if (!ids.has(id) && !active.has(id)) fired.delete(id);

    const w = pending().find((a) => a.def.level === 'warning');
    if (w && Date.now() - lastBeep > 3000) { lastBeep = Date.now(); if (Date.now() - w.since > 1000) beep([[0.15, 0.06], [0.15, 0]]); }
    if (!SN.sim.dive && active.size) { active.clear(); fired.clear(); }
  }

  function order(a, b) {
    const p = { warning: 0, caution: 1, notify: 2 };
    return p[a.def.level] - p[b.def.level];
  }
  function pending() { return Array.from(active.values()).filter((a) => !a.acked).sort(order); }

  /** Tastendruck quittiert den Alarm mit höchster Priorität (Kap. 7.1). true = verbraucht */
  function ack() {
    const p = pending();
    if (!p.length) return false;
    const a = p[0];
    a.acked = true;
    if (a.def.user) active.delete(a.def.id);
    return a.def;
  }

  /** Feldhervorhebung: Warnungen bis Auflösung; Vorsicht/Benachr. (Benutzer) bis Quittierung */
  function fieldLevel(field) {
    let best = null;
    for (const a of active.values()) {
      if (a.def.field !== field) continue;
      if (a.def.ackOnly) continue;
      if (a.def.user && a.acked) continue;
      if (!best || order(a, best) < 0) best = a;
    }
    return best ? best.def.level : null;
  }
  function takeover() {
    const p = pending().filter((a) => a.def.takeover);
    if (p.length) return p[0].def;
    // Gaswechsel-Hinweis bleibt im Fenster, bis gewechselt/verworfen
    const dv = active.get('deviation');
    if (dv) return dv.def;
    const g = active.get('gasswitch');
    if (g) return g.def;
    return null;
  }

  SN.alarms = { update, ack, pending, fieldLevel, takeover, active, beep, clear() { active.clear(); fired.clear(); } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

      const items = this._items || this.getItems();
      if (long) return false;
      if (b === 'up') { this.cursor = this.nextSel(items, this.cursor, -1); return true; }
      if (b === 'down') { this.cursor = this.nextSel(items, this.cursor, 1); return true; }
      if (b === 'back') { if (this.onBack) this.onBack(); else nav.pop(); return true; }
      if (b === 'ok') {
        const it = items[this.cursor];
        if (!it || it.disabled) return true;
        if (it.kind === 'toggle' && it.set) { it.set(!it.value); SN.state.save(); return true; }
        if (it.onOk) { it.onOk(this, it); SN.state.save(); }
        return true;
      }
      return false;
    }
  }

  // ---------- Wertauswahl (Räder) ----------
  class PickerScreen {
    constructor(o) {
      Object.assign(this, { col: 0 }, o);
      this.cols.forEach((c) => { if (c.index == null) c.index = 0; });
    }
    vals() { return this.cols.map((c) => c.values[c.index]); }
    render() {
      const cols = this.cols.map((c, ci) => {
        const f = c.fmt || ((v) => v);
        const v = c.values;
        const i = c.index;
        const act = ci === this.col;
        return '<div class="pcol ' + (act ? 'act' : '') + '" style="' + (c.w ? 'width:' + c.w + 'px' : '') + '">' +
          (c.label ? '<div class="plab">' + esc(c.label) + '</div>' : '') +
          '<div class="pprev">' + (i > 0 ? esc(f(v[i - 1])) : '&nbsp;') + '</div>' +
          '<div class="pcur">' + esc(f(v[i])) + '</div>' +
          '<div class="pnext">' + (i < v.length - 1 ? esc(f(v[i + 1])) : '&nbsp;') + '</div></div>' +
          (c.unit ? '<div class="punit">' + esc(c.unit) + '</div>' : '');
      }).join('');
      const last = this.col === this.cols.length - 1;
      const right = last && this.final === 'check' ? '<div class="pok">' + I.check + '</div>' : '<div class="pnx">' + I.chev + '</div>';
      return '<div class="scr picker">' + hints() + '<div class="ptitle">' + esc(t(this.title)) + '</div>' +
        '<div class="pcols">' + cols + '</div>' + right +
        (this.footer ? '<div class="pfoot">' + this.footer(this.vals()) + '</div>' : '') + '</div>';
    }
    onButton(b, long) {
      if (long) return false;
      const c = this.cols[this.col];
      if (b === 'up') { c.index = Math.max(0, c.index - 1); if (this.onChange) this.onChange(this); return true; }
      if (b === 'down') { c.index = Math.min(c.values.length - 1, c.index + 1); if (this.onChange) this.onChange(this); return true; }
      if (b === 'back') { if (this.col > 0) this.col--; else nav.pop(); return true; }
      if (b === 'ok') {
        if (this.col < this.cols.length - 1) this.col++;
        else { this.onDone(this.vals(), this); SN.state.save(); }
        return true;
      }
      return false;
    }
  }
  // Tastenhinweise an den Displayecken (wie in den Screenshots)
  function hints() {
    return '<div class="hint h-up">' + '<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></div>' +
      '<div class="hint h-back"><svg viewBox="0 0 24 24"><path d="M9 6L4 11l5 5M4 11h10a5 5 0 010 10h-2" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></div>' +
      '<div class="hint h-down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></div>' +
      '<div class="hint h-ok"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></div>';
  }

  // ---------- Scrollbare Inhaltsansicht ----------
  class InfoScreen {
    constructor(o) { Object.assign(this, { scroll: 0, maxScroll: 0 }, o); }
    render() {
      const html = typeof this.content === 'function' ? this.content(this) : this.content;
      return '<div class="scr info ' + (this.cls || '') + '"><div class="icontent" style="transform:translateY(' + (-this.scroll) + 'px)">' + html + '</div></div>';
    }
    afterRender(el) {
      const c = el.querySelector('.icontent');
      if (c) this.maxScroll = Math.max(0, c.scrollHeight - 380);
      if (this.scroll > this.maxScroll) this.scroll = this.maxScroll;
    }
    onButton(b, long) {
      if (long) return false;
      if (b === 'up') { this.scroll = Math.max(0, this.scroll - 110); return true; }
      if (b === 'down') {
        if (this.scroll >= this.maxScroll && this.onEnd) { this.onEnd(this); return true; }
        this.scroll = Math.min(this.maxScroll, this.scroll + 110); return true;
      }
      if (b === 'back') { if (this.onBack) this.onBack(this); else nav.pop(); return true; }
      if (b === 'ok') { if (this.onOk) this.onOk(this); return true; }
      return false;
    }
  }

  // ---------- Popups ----------
  let toastTimer = null;
  const toast = { html: null, until: 0 };
  function showToast(html, ms) {
    toast.html = html; toast.until = Date.now() + (ms || 1600);
  }
  function toastHtml() {
    if (!toast.html || Date.now() > toast.until) return '';
    return '<div class="toast">' + toast.html + '</div>';
  }

  /** Bestätigungsdialog als Liste */
  function confirm(title, text, okLabel, onYes, opts) {
    opts = opts || {};
    return new InfoScreen({
      cls: 'confirm',
      content: () => '<div class="cf">' + (opts.icon || '<div class="cf-ic warn">' + I.warn + '</div>') +
        '<div class="cf-t">' + esc(t(title)) + '</div><div class="cf-x">' + text + '</div>' +
        '<div class="cf-b"><span class="ybtn">' + I.arrowR + '</span>' + esc(t(okLabel)) + '</div></div>',
      onOk: () => { nav.pop(); onYes(); },
    });
  }

  SN.ui = { nav, I, iconBox, header, ListScreen, PickerScreen, InfoScreen, showToast, toastHtml, confirm, hints, range };

  function range(a, b, step, dec) {
    const out = [];
    for (let v = a; v <= b + 1e-9; v += step) out.push(dec != null ? +v.toFixed(dec) : v);
    return out;
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Haupt-Display (Kap. 4.1, 4.5, 4.6, 9) – Layout nach den Screenshots des Handbuchs */
(function (G) {
  'use strict';
  const SN = (G.SN = G.SN || {});
  const S = SN.state;
  const I = SN.ui.I;
  const t = (s) => SN.t(s);
  const esc = SN.esc;

  // ---- Kompass & Stoppuhr (Kap. 9.3, 9.4) ----
  const compass = { bearing: null };
  const stopwatch = { running: false, acc: 0, since: 0 };
  function swValue() { return stopwatch.acc + (stopwatch.running ? (S.now() - stopwatch.since) / 1000 : 0); }

  function num(v, u, cls) {
    const s = String(v);
    const m = s.match(/^(-?[>]?\d+)(\.\d+)?(.*)$/);
    let h;
    if (m && m[2]) h = '<span class="ni">' + esc(m[1]) + '</span><span class="nd">' + esc(m[2]) + '</span>' + esc(m[3]);
    else h = esc(s);
    h = h.replace(/\u2032/g, '<span class="pr">\u2032</span>');
    return '<span class="num ' + (cls || '') + '">' + h + (u ? '<span class="u">' + esc(u) + '</span>' : '') + '</span>';
  }
  function d1(m) { const x = SN.U.depth(m, 1); return num(x.v, x.u); }

  function cell(cls, x, y, w, h, inner, lvl) {
    return '<div class="cell ' + cls + (lvl ? ' lv-' + lvl : '') + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px">' + inner + '</div>';
  }

  // ---- Felder des Umschaltfensters ----
  const FIELDS = {
    maxDepth: { label: 'MAX DEPTH', name: 'Max depth' },
    clock: { label: 'TIME', name: 'Time' },
    tankPressure: { label: 'TANK PRESSURE', name: 'Tank pressure' },
    gasConsumption: { label: 'GAS CONSUMPTION', name: 'Gas consumption' },
    gasTime: { label: 'GAS TIME', name: 'Gas time' },
    tts: { label: 'TIME TO SURFACE', name: 'Time to surface' },
    ppo2Mod: { label: 'ppO₂ / MOD', name: 'ppO2 / MOD' },
    avgDepth: { label: 'AVG. DEPTH', name: 'Average depth' },
    gf: { label: 'GRADIENT FACTORS', name: 'Gradient factors' },
    gf99: { label: 'GF99 / SURF. GF', name: 'GF99 / Surf. GF' },
    contingency: { label: 'Δ+5 / @5', name: 'Contingency Δ+5 / @5' },
    ascentSpeed: { label: 'ASCENT SPEED', name: 'Ascent speed' },
    tissues: { label: 'TISSUES', name: 'Tissues', largeOnly: true },
    ceiling: { label: 'CEILING', name: 'Ceiling' },
    activeGas: { label: 'ACTIVE GAS', name: 'Active gas' },
    otuCns: { label: 'OTU / CNS', name: 'OTU CNS' },
    compass: { label: 'COMPASS', name: 'Compass', largeOnly: true },
    stopwatch: { label: 'STOPWATCH', name: 'Stopwatch', largeOnly: true },
  };

  function lab(s) { return '<div class="flab">' + s + '</div>'; }

  function bottleBar(p, start, vertical) {
    // rot = < 50 bar, gelb = bis 100 bar (Annahme), blau = Füllstand, schraffiert = leer
    const max = Math.max(200, start || 0, p || 0);
    const pct = (x) => Math.max(0, Math.min(100, (x / max) * 100));
    const fill = pct(p);
    const r = pct(Math.min(p, 50)), y = pct(Math.min(p, 100)) - r;
    if (vertical) {
      return '<div class="bbar v"><i class="hatch"></i><i class="b" style="height:' + fill + '%"></i><i class="y" style="height:' + (r + Math.max(0, y)) + '%"></i><i class="r" style="height:' + r + '%"></i></div>';
    }
    return '<div class="bbar h"><i class="hatch"></i><i class="b" style="width:' + fill + '%"></i><i class="y" style="width:' + (r + Math.max(0, y)) + '%"></i><i class="r" style="width:' + r + '%"></i></div>';
  }

  function tankField(size, lvl) {
    const m = S.mode();
    const gas = S.activeGas(m);
    const pods = SN.sim.podsFor(gas);
    const L = lab(t('TANK PRESSURE'));
    if (!pods.length) return L + '<div class="fval small">' + esc(t('No tank POD')) + '</div>';
    const dv = SN.sim.dive;
    const st = dv && dv.gasUse[gas.id] ? dv.gasUse[gas.id].start : [];
    if (pods.length === 1) {
      const p = pods[0];
      if (!p.data) return L + '<div class="fval">' + num('- -', SN.U.press(0).u) + '</div>';
      const pr = SN.U.press(p.pressure);
      return L + '<div class="tankrow">' + num(pr.v, pr.u) + bottleBar(p.pressure, st[0], true) + '</div>';
    }
    return L + pods.map((p, i) => {
      if (!p.data) return '<div class="podrow">' + num('- -', 'bar') + '<span class="podn">' + I.pod + (p.slot + 1) + '</span></div>';
      const pr = SN.U.press(p.pressure);
      return '<div class="podrow">' + num(pr.v, pr.u) + '<span class="podn">' + I.pod + (p.slot + 1) + '</span>' + bottleBar(p.pressure, st[i], false) + '</div>';
    }).join('');
  }

  function twoCol(l1, v1, l2, v2, lv1, lv2) {
    return '<div class="two"><div class="half ' + (lv1 ? 'lv-' + lv1 : '') + '">' + lab(l1) + '<div class="fval">' + v1 + '</div></div>' +
      '<div class="half ' + (lv2 ? 'lv-' + lv2 : '') + '">' + lab(l2) + '<div class="fval">' + v2 + '</div></div></div>';
  }

  function fieldHTML(key, size) {
    const l = SN.sim.live, dv = SN.sim.dive, m = S.mode();
    const gas = S.activeGas(m);
    const fl = SN.alarms.fieldLevel;
    switch (key) {
      case 'maxDepth': return lab('MAX DEPTH') + '<div class="fval">' + d1(dv ? dv.maxDepth : lastLog() ? lastLog().maxDepth : 0).replace('class="num', 'class="num') + '</div>';
      case 'clock': return lab('TIME') + '<div class="fval">' + num(SN.fmt.clock(S.now())) + '</div>';
      case 'tankPressure': return tankField(size);
      case 'gasConsumption': {
        const v = l.rmv != null ? SN.U.vol(l.rmv) : { v: '- -', u: SN.U.vol(1).u };
        return lab('GAS CONSUMPTION') + '<div class="fval">' + num(v.v, v.u) + '</div>';
      }
      case 'gasTime': {
        const v = l.gasTime != null ? Math.floor(l.gasTime / 60) + ':' + String(Math.floor(l.gasTime % 60)).padStart(2, '0') : '- -';
        return lab('GAS TIME') + '<div class="fval">' + num(v) + '</div>';
      }
      case 'tts': return lab('TIME TO SURFACE') + '<div class="fval">' + num(m.algo.enabled ? Math.ceil(l.tts) : '- -', 'min') + '</div>';
      case 'ppo2Mod': {
        const md = SN.U.depth(SN.Deco.mod(gas), 1);
        const lv = fl('ppo2');
        return twoCol('ppO₂', num(l.ppo2.toFixed(1)), 'MOD', num(md.v, md.u), lv, null);
      }
      case 'avgDepth': {
        const a = dv && dv.depthTime ? dv.depthSum / dv.depthTime : 0;
        const x = SN.U.depth(a, 0);
        return lab('AVG. DEPTH') + '<div class="fval">' + num(x.v, x.u) + '</div>';
      }
      case 'gf': { const g = S.gf(m); return lab('GRADIENT FACTORS') + '<div class="fval">' + num(g.lo + '/' + g.hi) + '</div>'; }
      case 'gf99': {
        const g = S.gf(m);
        const g99 = l.gf99 < 0 ? '- -' : Math.round(l.gf99);
        const lv1 = l.gf99 >= 100 ? 'warning' : l.gf99 > g.hi ? 'caution' : null;
        const lv2 = l.gf99 >= 100 ? 'warning' : l.gf99 > g.hi ? 'caution' : null;
        return twoCol('GF99', num(g99, '%'), 'SURF. GF', num(Math.max(0, Math.round(l.surfGF)), '%'), lv1, lv2);
      }
      case 'contingency': return twoCol('Δ+5', num(Math.round(l.delta5) + '′'), '@5', num(Math.ceil(l.at5) + '′'));
      case 'ascentSpeed': {
        const v = SN.state.settings.units.depth === 'ft' ? Math.max(0, Math.round(l.ascRate * 3.28)) : Math.max(0, Math.round(l.ascRate));
        return lab('ASCENT SPEED') + '<div class="fval">' + num(v, SN.state.settings.units.depth === 'ft' ? 'ft/min' : 'm/min') + '</div>';
      }
      case 'ceiling': { const x = SN.U.depth(l.inDeco ? l.deko : 0, 1); return lab('CEILING') + '<div class="fval">' + num(x.v, x.u) + '</div>'; }
      case 'activeGas': return lab('ACTIVE GAS') + '<div class="fval gas">' + esc(SN.fmt.gasName(gas)) + '</div>';
      case 'otuCns': {
        const otu = Math.ceil(SN.sim.dailyOTU());
        const cns = Math.ceil(S.cns);
        return twoCol('OTU', num(otu), 'CNS', num(cns, '%'), fl('otu'), fl('cns'));
      }
      case 'tissues': return tissuesHTML();
      case 'compass': return compassHTML(size);
      case 'stopwatch': {
        const v = swValue();
        return lab('STOPWATCH') + '<div class="fval sw">' + num(SN.fmt.mmss(v)) + '</div><div class="swic">' + (stopwatch.running ? I.pause : I.play) + '</div>';
      }
    }
    return '';
  }

  function tissuesHTML() {
    const ch = S.tissues.chart(SN.sim.live.pamb);
    const bars = ch.map((c) => {
      const w = Math.min(150, c.ratio * 100) / 150 * 100;
      const col = c.overM ? 'r' : c.overAmb ? 'y' : 'g';
      return '<i class="' + col + '" style="width:' + w + '%"></i>';
    }).join('');
    return lab('TISSUES') + '<div class="tis"><div class="tisbars">' + bars + '</div><div class="tisgrid"><s style="left:33.3%"></s><s style="left:66.6%"></s><s style="left:100%"></s></div>' +
      '<div class="tisax"><span>0%</span><span>50</span><span>100</span><span>150</span></div></div>';
  }

  function compassHTML(size) {
    const env = S.env;
    const R = size === 'large' ? 112 : 60;
    const cx = 128, cy = size === 'large' ? 144 : 70;
    const h = ((env.heading + S.settings.nav.declination) % 360 + 360) % 360;
    if (!env.compassCal) {
      return '<div class="cal"><div class="calic">' + I.infinity + '</div><div>Calibrate<br>compass</div></div>' + ring(cx, cy, R, h, true);
    }
    const mils = S.settings.nav.compassUnit === 'mil';
    const val = mils ? Math.round(h * 6400 / 360) : Math.round(h) + '°';
    let brg = '';
    if (compass.bearing != null) brg = '<div class="brg">' + (mils ? Math.round(compass.bearing * 6400 / 360) : Math.round(compass.bearing) + '°') + '</div>';
    return ring(cx, cy, R, h, false) + '<div class="hdg' + (compass.bearing != null ? ' wb' : '') + '">' + val + '</div>' + brg;
  }
  function ring(cx, cy, R, h, dim) {
    let s = '<svg class="ring" viewBox="0 0 256 288" width="256" height="288">';
    s += '<line x1="' + cx + '" y1="' + (cy - R - 14) + '" x2="' + cx + '" y2="' + (cy - R + 18) + '" stroke="#777" stroke-width="1.5"/>';
    s += '<line x1="' + cx + '" y1="' + (cy + R - 18) + '" x2="' + cx + '" y2="' + (cy + R + 14) + '" stroke="#777" stroke-width="1.5"/>';
    s += '<g transform="rotate(' + (-h) + ' ' + cx + ' ' + cy + ')">';
    for (let a = 0; a < 360; a += 5) {
      const long = a % 30 === 0;
      const r1 = R - (long ? 12 : 6);
      const rad = a * Math.PI / 180;
      s += '<line x1="' + (cx + Math.sin(rad) * r1) + '" y1="' + (cy - Math.cos(rad) * r1) + '" x2="' + (cx + Math.sin(rad) * R) + '" y2="' + (cy - Math.cos(rad) * R) + '" stroke="#ddd" stroke-width="' + (long ? 2.2 : 1.4) + '"/>';
    }
    const L = [['E', 90], ['S', 180], ['W', 270]];
    for (const [c, a] of L) {
      const rad = a * Math.PI / 180, r = R - 24;
      s += '<text x="' + (cx + Math.sin(rad) * r) + '" y="' + (cy - Math.cos(rad) * r + 7) + '" fill="#fff" font-size="20" text-anchor="middle" transform="rotate(' + a + ' ' + (cx + Math.sin(rad) * r) + ' ' + (cy - Math.cos(rad) * r) + ')">' + c + '</text>';
    }
    s += '<path d="M' + cx + ' ' + (cy - R - 2) + 'l-9 -14h18z" fill="#ff3864" transform="rotate(10 ' + cx + ' ' + cy + ') rotate(-10 ' + cx + ' ' + cy + ')"/>';
    if (compass.bearing != null && !dim) {
      const b = compass.bearing;
      s += '<g transform="rotate(' + b + ' ' + cx + ' ' + cy + ')"><path d="M' + cx + ' ' + (cy - R + 4) + 'l-9 -16h18z" fill="#ffd400"/></g>';
      s += '<g transform="rotate(' + (b + 180) + ' ' + cx + ' ' + cy + ')"><rect x="' + (cx - 7) + '" y="' + (cy - R - 3) + '" width="14" height="6" fill="#ff8a00"/></g>';
    }
    s += '</g></svg>';
    return s;
  }

  function lastLog() { return S.logs[S.logs.length - 1]; }

  function switchWindow() {
    const m = S.mode();
    const to = SN.alarms.takeover();
    if (to && SN.sim.dive) return takeoverHTML(to);
    const v = m.views[m.viewIndex % m.views.length];
    if (!v) return cell('sw', 432, 0, 256, 288, '');
    if (v.type === 'large') return cell('sw large f-' + v.f[0], 432, 0, 256, 288, fieldHTML(v.f[0], 'large'), lvFor(v.f[0]));
    return cell('sw f-' + v.f[0], 432, 0, 256, 141, fieldHTML(v.f[0], 'half'), lvFor(v.f[0])) +
      cell('sw f-' + v.f[1], 432, 147, 256, 141, fieldHTML(v.f[1], 'half'), lvFor(v.f[1]));
  }
  function lvFor(key) {
    if (key === 'tankPressure') return SN.alarms.fieldLevel('tank');
    return null;
  }

  function takeoverHTML(def) {
    const l = SN.sim.live, dv = SN.sim.dive, m = S.mode();
    const lvl = def.level;
    let inner = '';
    if (def.takeover === 'deviation') {
      inner = '<div class="to-warn">' + I.warn + '<span class="stripes"></span></div><div class="to-txt">ALGORITHM<br>DEVIATION!' +
        (l.above === 'broken' ? '<br><br>SURPASSED THE<br>DECO CEILING' : '') + '</div>';
    } else if (def.takeover === 'gasswitch') {
      inner = '<div class="to-mid"><div class="to-l">SWITCH GAS</div><div class="to-v">' + esc(SN.fmt.gasName(dv.suggest || S.activeGas(m))) + '</div></div>';
    } else if (def.takeover === 'tank') {
      const gas = S.activeGas(m);
      const pods = SN.sim.podsFor(gas).filter((p) => p.data);
      const p = pods.length ? Math.min(...pods.map((x) => x.pressure)) : 0;
      const pr = SN.U.press(p);
      inner = '<div class="flab">TANK PRESSURE</div>' + (lvl === 'warning' ? '<div class="to-warn sm">' + I.warn + '<span class="stripes"></span></div>' : '') +
        '<div class="to-tank">' + num(pr.v, pr.u) + '<span class="bottle"><i style="height:' + Math.min(100, p / 2) + '%"></i></span></div>';
    } else if (def.takeover === 'sidemount') {
      const gas = S.activeGas(m);
      const pods = SN.sim.podsFor(gas).filter((p) => p.data);
      const diff = pods.length > 1 ? Math.abs(pods[0].pressure - pods[1].pressure) : 0;
      const pr = SN.U.press(diff);
      inner = '<div class="to-mid"><div class="to-l">SIDEMOUNT</div><div class="to-v">' + num(pr.v, pr.u) + '</div></div>';
    } else if (def.takeover === 'gastime') {
      inner = '<div class="to-mid"><div class="to-l">GAS TIME</div><div class="to-v">' + num(Math.floor((l.gasTime || 0) / 60) + ':' + String(Math.floor((l.gasTime || 0) % 60)).padStart(2, '0')) + '</div></div>';
    }
    return cell('sw takeover', 432, 0, 256, 288, inner, lvl);
  }

  // ---- Aufstiegsgeschwindigkeit (Kap. 4.5) ----
  function ascentBar() {
    const l = SN.sim.live, dv = SN.sim.dive;
    const r = dv ? l.ascRate : 0;
    const fast = l.ascFastSince != null && dv && dv.runtime - l.ascFastSince >= 5;
    let n = 0, col = 'gray';
    // ein Balkenschritt = 2 m/min; grau < 2, grün bis 8, gelb > 8, rot > 10 m/min (Kap. 4.5, Abbildung)
    if (r >= 0.5) {
      if (r < 2) { n = 1; col = 'gray'; }
      else if (r <= 8) { n = Math.min(3, Math.floor(r / 2)); col = 'green'; }
      else if (r <= 10) { n = 4; col = 'yellow'; }
      else { n = 5; col = 'red'; }
    }
    let segs = '';
    for (let i = 4; i >= 0; i--) {
      if (i < n) segs += '<i class="chevr ' + col + '"><svg viewBox="0 0 40 22"><path d="M5 18L20 5l15 13" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></i>';
      else segs += '<i class="seg"></i>';
    }
    return cell('asc' + (fast ? ' fast' : ''), 354, 0, 72, 152, '<div class="segs">' + segs + '</div>');
  }

  // ---- Dekofeld ----
  function decoCell(surface) {
    const l = SN.sim.live, m = S.mode();
    const lv = SN.alarms.fieldLevel('deco');
    if (!m.algo.enabled) return cell('deco', 256, 158, 170, 130, lab('NO DECO') + '<div class="dval">' + num('- -') + '</div>');
    const g = S.gf(m);
    // vertikaler Balken: Bedeutung im Handbuch nicht erklärt -> hier Oberflächen-GF relativ zu GF High (Annahme)
    let bar;
    if (l.inDeco) {
      const f = Math.min(100, Math.max(8, (l.surfGF - g.hi) / Math.max(1, 100 - g.hi) * 100));
      bar = '<div class="nbar deco"><i class="hatch"></i><i class="o" style="height:' + f + '%"></i></div>';
    } else {
      const f = Math.min(100, Math.max(6, 100 - Math.max(0, l.surfGF) / g.hi * 100));
      bar = '<div class="nbar"><i class="hatch"></i><i class="g" style="height:' + f + '%"></i><i class="o"></i></div>';
    }
    const ndlTxt = l.ndl >= 100 ? '>99′' : l.ndl + '′';
    if (l.inDeco) {
      return cell('deco', 256, 158, 170, 130, '<div class="dtag">DECO</div><div class="dval">' + num(Math.ceil(l.tts) + '′') + '</div>' + bar, lv);
    }
    if (m.decoField === 'ndltts' && !surface) {
      return cell('deco ndltts', 256, 158, 170, 130,
        '<div class="nt"><span class="g">NDL</span>' + num(ndlTxt) + '</div><div class="nt"><span class="y">TTS</span>' + num(String(Math.ceil(l.tts)).padStart(2, '0') + '′') + '</div>' + bar, lv);
    }
    return cell('deco', 256, 158, 170, 130, '<div class="flab green">NO DECO</div><div class="dval">' + num(ndlTxt) + '</div>' + bar, lv);
  }

  // ---- Stoppbereich (unten links) ----
  function stopCell() {
    const l = SN.sim.live, dv = SN.sim.dive, m = S.mode();
    const sf = dv.safety;
    const W = 426;
    const x = (v) => SN.U.depth(v, 1);
    if (dv.surfacedAt != null) {
      const st = SN.fmt.surfTime(dv.runtime - dv.surfacedAt);
      return cell('stop', 0, 294, W, 86, '<div class="sv">' + num(st.v, st.u) + '</div><div class="sl">SURFACE TIME</div>');
    }
    if (m.algo.enabled && l.inDeco) {
      if (m.algo.profile === 'stepped') {
        const dd = SN.U.depth(l.stopDepth, 0);
        const tcls = l.above === 'broken' ? 'lv-warning pill' : l.above === 'reserve' ? 'lv-caution pill' : l.inWindow ? 'beige pill' : '';
        return cell('stop', 0, 294, W, 86, '<div class="sv">' + num(dd.v, dd.u) + '</div><div class="st ' + tcls + '">' + num(Math.ceil(l.stopTime) + '′') + '</div><div class="sl r">STOP</div>');
      }
      const lv = l.above === 'broken' ? 'warning' : l.above === 'reserve' ? 'caution' : l.inWindow ? 'beige' : null;
      const c = x(Math.max(l.deko, 0));
      return cell('stop', 0, 294, W, 86, '<div class="sv">' + num(c.v, c.u) + '</div><div class="sl">CEILING</div>', lv);
    }
    if (sf.required && sf.done) {
      return cell('stop', 0, 294, W, 86, '<div class="done">' + esc(t('STOP DONE')) + '</div>');
    }
    if (sf.required) {
      if (sf.started) {
        const lv = SN.alarms.fieldLevel('stop');
        const pill = lv === 'caution' ? 'lv-caution' : (l.depth >= 2.4 && l.depth <= 6) ? 'beige' : 'plain';
        return cell('stop', 0, 294, W, 86, '<div class="st big pill ' + pill + '">' + num(SN.fmt.mmss(sf.remaining)) + '</div><div class="sl">' + esc(t('SAFETY STOP')) + '</div>');
      }
      return cell('stop', 0, 294, W, 86, '<div class="sv">' + num(x(3).v, x(3).u) + '</div><div class="sl">' + esc(t('SAFETY STOP')) + '</div>');
    }
    return cell('stop', 0, 294, W, 86, '');
  }

  // Pfeile neben der Tiefe (Kap. 8.3, 9.1, 9.2)
  function depthIcon() {
    const l = SN.sim.live, dv = SN.sim.dive, m = S.mode();
    if (!dv || !m.algo.enabled) return '';
    if (l.inDeco) {
      if (l.above === 'broken') return '<div class="dic red"><svg viewBox="0 0 24 48"><path d="M4 6h16L12 20zM4 26h16L12 40z" fill="#ff2626"/></svg></div>';
      if (l.above === 'reserve') return '<div class="dic yel"><svg viewBox="0 0 24 48"><path d="M4 14h16L12 32z" fill="#000"/></svg></div>';
      if (l.inWindow) return '<div class="dic win"><svg viewBox="0 0 24 48"><path d="M4 5h16L12 22zM4 43h16L12 26z" fill="#ffd400"/></svg></div>';
      return '';
    }
    const sf = dv.safety;
    if (sf.required && !sf.done && dv.surfacedAt == null) {
      if (sf.started && l.depth < 2.4) return '<div class="dic yel"><svg viewBox="0 0 24 48"><path d="M4 14h16L12 32z" fill="#000"/></svg></div>';
      if (l.depth >= 2.4 && l.depth <= 6) return '<div class="dic win"><svg viewBox="0 0 24 48"><path d="M4 5h16L12 22zM4 43h16L12 26z" fill="#ffd400"/></svg></div>';
    }
    return '';
  }

  function statusCell(surface) {
    const env = S.env, l = SN.sim.live, m = S.mode();
    const fl = S.settings.flashlight ? 'on' : '';
    const bat = Math.round(env.battery);
    const low = bat < 5 ? 'crit' : bat < 20 ? 'low' : '';
    const tp = SN.U.temp(l.temp);
    const dev = S.deviationUntil > S.now() || (SN.sim.dive && SN.sim.dive.deviation);
    if (!surface) {
      return cell('status', 432, 294, 256, 86, '<span class="fl ' + fl + '">' + I.flash + '</span>' + (dev ? '<span class="devic">' + I.warn + '</span>' : '') +
        '<span class="sv2">' + num(tp.v, tp.u) + '</span><span class="sv2 ' + low + '">' + num(bat, '%') + '</span>');
    }
    const gas = S.activeGas(m);
    const pods = SN.sim.podsFor(gas);
    let icons = '';
    if (S.settings.bt.sensors.length) icons += '<span class="ic hr ' + (env.hrBeltOn ? 'ok' : 'search') + '">' + I.heart + '</span>';
    if (m.extra.gps) icons += '<span class="ic gp ' + (l.gpsFix ? 'ok' : 'search') + '">' + I.gps + '</span>';
    let podI = '';
    if (pods.length) {
      const lowb = pods.some((p) => p.pod && p.pod.battery === 'low');
      podI = '<span class="ic pd ' + (lowb ? 'lowb' : '') + '">' + I.pod + '<b>x' + pods.length + '</b></span>';
    }
    return cell('status surf', 432, 294, 256, 86, '<span class="fl ' + fl + '">' + I.flash + '</span>' +
      '<span class="icons"><span>' + icons + '</span><span>' + podI + '</span></span>' +
      '<span class="bt"><span class="' + low + '">' + num(bat, '%') + '</span><span>' + num(tp.v, tp.u) + '</span></span>');
  }

  function render() {
    const l = SN.sim.live, dv = SN.sim.dive;
    let h = '<div class="scr face">';
    if (!dv) {
      // Oberflächen-Display (Kap. 4.1)
      const ll = lastLog();
      const md = ll ? SN.U.depth(ll.maxDepth, 1) : null;
      h += cell('depth surf', 0, 0, 348, 152, lab('MAX DEPTH') + '<div class="dsv">' + (md ? num(md.v, md.u) : num('- -')) + '</div>');
      h += ascentBar();
      h += cell('time surf', 0, 158, 250, 130, lab('LAST DIVE') + '<div class="tsv">' + num(ll ? SN.fmt.mmss(ll.duration) : '- -') + '</div>');
      h += decoCell(true);
      const st = ll ? SN.fmt.surfTime((S.now() - ll.end) / 1000) : null;
      h += cell('stop', 0, 294, 426, 86, ll ? '<div class="sv">' + num(st.v, st.u) + '</div><div class="sl">SURFACE TIME</div>' : '');
      h += switchWindow();
      h += statusCell(true);
    } else {
      const dd = SN.U.depth(l.depth, 1);
      h += cell('depth', 0, 0, 348, 152, '<div class="dv">' + num(dd.v, dd.u) + '</div>' + depthIcon(), SN.alarms.fieldLevel('depth'));
      h += ascentBar();
      h += cell('time', 0, 158, 250, 130, '<div class="tv">' + num(SN.fmt.mmss(dv.runtime)) + '</div>', SN.alarms.fieldLevel('time'));
      h += decoCell(false);
      h += stopCell();
      h += switchWindow();
      h += statusCell(false);
    }
    h += '</div>';
    return h;
  }

  const Face = {
    render,
    onButton(b, long) {
      const m = S.mode();
      const v = m.views[m.viewIndex % m.views.length];
      const inDive = !!SN.sim.dive;
      if (b === 'ok' && !long) { m.viewIndex = (m.viewIndex + 1) % m.views.length; S.save(); return true; }
      if (b === 'back') {
        if (v && v.type === 'large' && v.f[0] === 'compass') {
          if (!S.env.compassCal) return true;
          if (long) { compass.bearing = null; SN.ui.showToast(esc(t('Bearing cleared'))); }
          else { compass.bearing = (S.env.heading + S.settings.nav.declination + 360) % 360; SN.ui.showToast(esc(t('Bearing set'))); }
          return true;
        }
        if (v && v.type === 'large' && v.f[0] === 'stopwatch') {
          if (long) { stopwatch.running = false; stopwatch.acc = 0; }
          else if (stopwatch.running) { stopwatch.acc = swValue(); stopwatch.running = false; }
          else { stopwatch.since = S.now(); stopwatch.running = true; }
          return true;
        }
        return true;
      }
      if (b === 'up' && !long) {
        if (inDive) { SN.app.cycleBrightness(); return true; }
        SN.app.openWidgets(); return true;
      }
      if (b === 'down' && !long) {
        if (inDive) { SN.screens.diveMenu(); return true; }
        SN.screens.diveSettings(); return true;
      }
      return false;
    },
  };

  SN.face = { Face, FIELDS, fieldHTML, compass, stopwatch, num, bottleBar };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Menüs und Ansichten (Kap. 3–5, 7, 8, 10–12) */
(function (G) {
  'use strict';
  const SN = (G.SN = G.SN || {});
  const S = SN.state;
  const { nav, I, iconBox, ListScreen, PickerScreen, InfoScreen, confirm, range } = SN.ui;
  const t = (s) => SN.t(s);
  const esc = SN.esc;
  const num = (...a) => SN.face.num(...a);
  const fmt = SN.fmt;
  const push = (s) => nav.push(s);
  const L = (o) => new ListScreen(o);
  const toast = (s) => SN.ui.showToast(esc(t(s)));

  function radioList(title, opts, get, set, back = true) {
    return L({
      title,
      items: () => opts.map((o) => ({ label: o[1], sub: o[2], kind: 'radio', value: get() === o[0], onOk: () => { set(o[0]); S.save(); if (back) nav.pop(); } })),
    });
  }
  function on(v) { return v ? t('On') : t('Off'); }
  function depthStr(m, dec = 1) { const d = SN.U.depth(m, dec); return d.v + ' ' + d.u; }

  // =================== Taucheinstellungen (Nach-unten-Taste) ===================
  function diveSettings() {
    push(L({
      title: 'DIVE SETTINGS',
      items: () => {
        const m = S.mode();
        return [
          { label: 'Dive mode', sub: S.settings.diveMode === 'single' ? 'Single gas' : 'Multigas', icon: iconBox(I.diver), onOk: diveMode },
          { label: 'Gases', sub: S.usableGases().map(fmt.gasName).join(', '), icon: iconBox(I.tank), onOk: gases },
          { label: 'Algorithm', sub: m.algo.enabled ? S.gf().lo + '/' + S.gf().hi : t('Off'), icon: iconBox(I.sliders), onOk: algorithm },
          { label: 'Alarms', icon: iconBox(I.warn), onOk: alarms },
          { label: 'Tank PODs', icon: iconBox(I.pod), onOk: tankPodsMenu },
          { label: 'Dive planner', icon: iconBox(I.planner), onOk: planner },
          { label: 'Customization', icon: iconBox(I.sliders), onOk: customization },
          { label: 'Additional settings', icon: iconBox(I.dots), onOk: additional },
        ];
      },
    }));
  }

  function diveMode() {
    push(L({
      title: 'DIVE MODE',
      items: () => [
        { label: 'Single gas', icon: iconBox(I.tank), value: S.settings.diveMode === 'single', onOk: () => { S.settings.diveMode = 'single'; nav.pop(); } },
        { label: 'Multigas', icon: iconBox(I.tank2), value: S.settings.diveMode === 'multi', onOk: () => { S.settings.diveMode = 'multi'; nav.pop(); } },
      ],
    }));
  }

  // =================== Gase (Kap. 5) ===================
  function gasRow(g) {
    const pods = SN.sim.podsFor(g);
    const md = SN.U.depth(SN.Deco.mod(g), 1);
    const isA = g.state === 'active';
    let right = '';
    if (pods.length === 1) {
      const p = pods[0];
      right = '<div class="gpod"><div class="gpl">' + I.pod + '</div><div class="gpk">TANKPOD</div><div class="gpv">' + (p.data ? SN.U.press(p.pressure).v + ' ' + SN.U.press(0).u : '- -') + '</div></div>';
    } else if (pods.length === 2) {
      right = '<div class="gpod two"><div class="gpl">' + I.pod + I.pod + '</div><div class="gpk"><span>POD 1</span><span>POD 2</span></div><div class="gpv">' +
        pods.map((p) => '<span>' + (p.data ? SN.U.press(p.pressure).v : '- -') + '</span>').join('') + '<small>' + SN.U.press(0).u + '</small></div></div>';
    }
    return '<div class="gasrow"><div class="gl"><div class="gn">' + (isA ? '<span class="gchk">' + I.check + '</span>' : g.state === 'enabled' ? '<span class="gchk en">' + I.check + '</span>' : '') + esc(fmt.gasName(g)) + '</div>' +
      '<div class="gk"><span>ppO₂</span><span>MOD</span></div><div class="gv"><span>' + g.ppo2.toFixed(1) + '</span><span>' + md.v + '<small>' + md.u + '</small></span></div></div>' + right + '</div>';
  }

  function gases() {
    push(L({
      title: 'GASES',
      items: () => {
        const m = S.mode();
        const multi = S.settings.diveMode === 'multi';
        const max = multi ? 5 : 6;
        const its = [];
        if (m.gases.length < max) its.push({ label: 'New gas', icon: iconBox(I.plus, 'green'), onOk: newGas });
        const order = { active: 0, enabled: 1, disabled: 2 };
        const list = m.gases.slice().sort((a, b) => order[a.state] - order[b.state] || a.o2 - b.o2);
        let sec = false;
        for (const g of list) {
          if (g.state === 'disabled' && !sec) { its.push({ kind: 'section', label: 'DISABLED GASES' }); sec = true; }
          its.push({ html: gasRow(g), h: 118, cls: 'gas ' + g.state, onOk: () => gasEdit(g) });
        }
        return its;
      },
    }));
  }
  function newGas() {
    const m = S.mode();
    const multi = S.settings.diveMode === 'multi';
    const g = S.newGas(32, 0, 1.4, multi ? 'enabled' : 'disabled');
    m.gases.push(g);
    S.save();
    gasEdit(g);
    gasMixture(g);
  }

  function gasEdit(g) {
    push(L({
      title: () => 'EDIT ' + fmt.gasName(g),
      get titleStr() { return 'EDIT ' + fmt.gasName(g); },
      items: () => {
        const m = S.mode();
        const pods = SN.sim.podsFor(g);
        const md = SN.U.depth(SN.Deco.mod(g), 1);
        const stLabel = g.state === 'active' ? 'Active gas' : g.state === 'enabled' ? 'Enabled' : 'Disabled';
        const its = [
          { label: stLabel, cls: 'stateband ' + g.state, h: 48, onOk: () => gasState(g) },
          { html: '<div class="mixrow"><div><div class="mk">MIXTURE</div><div class="mv">' + esc(fmt.gasName(g)) + '</div></div><div><div class="mk">ppO₂</div><div class="mv">' + g.ppo2.toFixed(1) + '</div></div><div><div class="mk">MOD</div><div class="mv">' + md.v + '<small>' + md.u + '</small></div></div></div>', h: 76, onOk: () => gasMixture(g) },
          { label: 'Tank size', sub: tankSizeStr(g.tank), onOk: () => tankSize(g) },
          { label: 'Tank POD', sub: pods.length ? pods.map((p) => fmtSerial(p.serial)).join(', ') : t('Not linked'), onOk: () => tankPodLink(g) },
        ];
        if (g.state !== 'active') its.push({ label: 'Delete gas', icon: iconBox(I.trash, 'red'), onOk: () => { m.gases.splice(m.gases.indexOf(g), 1); nav.pop(); } });
        return its;
      },
    }));
    nav.top().title = 'EDIT ' + fmt.gasName(g);
    const s = nav.top();
    const r = s.render.bind(s);
    s.render = () => { s.title = 'EDIT ' + fmt.gasName(g); return r(); };
  }
  function gasState(g) {
    const multi = S.settings.diveMode === 'multi';
    const opts = multi ? [['active', 'Active'], ['enabled', 'Enabled'], ['disabled', 'Disabled']] : [['active', 'Active'], ['disabled', 'Disabled']];
    push(L({
      title: 'GAS STATE',
      items: () => opts.map(([k, lbl]) => ({
        label: lbl, icon: iconBox(I.tank, k === 'active' ? 'green' : k === 'enabled' ? '' : 'dim'), value: g.state === k,
        onOk: () => {
          const m = S.mode();
          if (g.state === 'active' && k !== 'active') { toast('Active gas'); nav.pop(); return; } // aktives Gas kann nicht abgewählt werden
          if (k === 'active') { m.gases.forEach((x) => { if (x.state === 'active') x.state = multi ? 'enabled' : 'disabled'; }); }
          if (multi && k !== 'disabled' && m.gases.filter((x) => x.state !== 'disabled' && x !== g).length >= 5) { nav.pop(); return; }
          g.state = k; nav.pop();
        },
      })),
    }));
  }
  function gasMixture(g) {
    const multi = S.settings.diveMode === 'multi';
    const o2s = range(multi ? 5 : 21, 100, 1);
    const pps = range(1.0, 1.6, 0.1, 1);
    const cols = [{ label: 'O₂', values: o2s, index: Math.max(0, o2s.indexOf(g.o2)) }];
    if (multi) cols.push({ label: 'HE', values: range(0, 100 - g.o2, 1), index: g.he });
    cols.push({ label: 'ppO₂', values: pps, index: Math.max(0, pps.indexOf(+g.ppo2.toFixed(1))), fmt: (v) => v.toFixed(1) });
    const p = new PickerScreen({
      title: 'GAS MIXTURE', cols, final: 'check',
      onChange: (s) => {
        if (multi) {
          const o2 = s.cols[0].values[s.cols[0].index];
          const heCol = s.cols[1];
          const cur = heCol.values[heCol.index];
          heCol.values = range(0, 100 - o2, 1);
          heCol.index = Math.min(cur, heCol.values.length - 1);
        }
      },
      footer: (v) => {
        const gg = { o2: v[0], ppo2: v[v.length - 1] };
        const md = SN.U.depth(SN.Deco.mod(gg), 1);
        return '<span class="fk">MOD</span> ' + num(md.v, md.u);
      },
      onDone: (v) => { g.o2 = v[0]; g.he = multi ? v[1] : 0; g.ppo2 = v[v.length - 1]; nav.pop(); },
    });
    push(p);
  }
  const TANKS_L = [3, 5, 7, 8, 10, 11.1, 12, 15, 18, 20, 24];
  const TANKS_CF = [40, 50, 63, 66, 72, 77, 80, 85, 95, 100, 117, 120, 130];
  function cfToL(cf) { return +(cf * 28.3168 / 207).toFixed(1); }
  function tankSizeStr(l) {
    if (S.settings.units.volume === 'cuft') return Math.round(l * 207 / 28.3168) + ' cu ft';
    return l + ' L';
  }
  function tankSize(g) {
    const cf = S.settings.units.volume === 'cuft';
    const vals = cf ? TANKS_CF : TANKS_L;
    let idx = cf ? vals.findIndex((v) => Math.abs(cfToL(v) - g.tank) < 0.3) : vals.indexOf(g.tank);
    if (idx < 0) idx = vals.indexOf(cf ? 80 : 12);
    push(new PickerScreen({
      title: 'TANK SIZE', cols: [{ values: vals, index: idx, unit: cf ? 'cu ft' : 'L' }], final: 'check',
      onDone: (v) => { g.tank = cf ? cfToL(v[0]) : v[0]; nav.pop(); },
    }));
  }
  function fmtSerial(s) { return s.replace(/(\d{4})(\d{4})(\d+)/, '$1 $2 $3'); }

  function podCard(pod, g) {
    const linked = linkedGases(pod.serial);
    return '<div class="podcard"><span class="pic ' + (linked.length ? 'g' : '') + '">' + I.pod + '</span><div><div class="ps">' + fmtSerial(pod.serial) + '</div>' +
      '<div class="pm">' + I.tank + ' ' + (pod.inRange && pod.active ? SN.U.press(pod.pressure).v + ' ' + SN.U.press(0).u : '- -') +
      ' &nbsp;⚡ ' + (pod.battery === 'low' ? '<b class="lowb">LOW</b>' : 'OK') + (linked.length ? ' &nbsp;<span class="lk">∞ ' + linked.map(fmt.gasName).join(', ') + '</span>' : '') + '</div></div></div>';
  }
  function linkedGases(serial) {
    const out = [];
    for (const k of ['single', 'multi']) if (k === S.settings.diveMode) S.settings.modes[k].gases.forEach((g) => { if (g.pods.includes(serial)) out.push(g); });
    return out;
  }
  function tankPodLink(g) {
    push(L({
      title: 'LINKED TANK PODS',
      items: () => {
        const its = [];
        [0, 1].forEach((slot) => {
          its.push({ kind: 'section', label: 'TANK POD ' + (slot + 1) + ':', cls: 'plain' });
          const ser = g.pods[slot];
          const pod = ser && S.env.pods.find((p) => p.serial === ser);
          if (pod) its.push({ html: podCard(pod, g), h: 92, cls: 'card', onOk: () => podPick(g, slot) });
          else its.push({ label: 'No tank POD', cls: 'card', onOk: () => podPick(g, slot) });
        });
        return its;
      },
    }));
    const s = nav.top(); const r = s.render.bind(s);
    s.render = () => { s.title = fmt.gasName(g) + ' - LINKED TANK PODS'; return r(); };
  }
  function podPick(g, slot) {
    push(L({
      title: 'TANK PODS',
      items: () => {
        // nur aktive PODs in Reichweite werden gefunden (Kap. 6.1)
        const found = S.env.pods.filter((p) => p.inRange && p.active);
        if (!found.length) return [{ label: 'No tank POD', kind: 'info' }];
        return found.map((p) => ({
          html: podCard(p, g), h: 92, kind: 'check', value: g.pods[slot] === p.serial,
          onOk: () => {
            if (g.pods[slot] === p.serial) g.pods[slot] = null;
            else { g.pods[slot] = p.serial; if (g.pods[1 - slot] === p.serial) g.pods[1 - slot] = null; }
            nav.pop();
          },
        }));
      },
    }));
  }
  function tankPodsMenu() {
    push(L({
      title: 'TANK PODS',
      items: () => {
        const found = S.env.pods.filter((p) => linkedGases(p.serial).length || (p.inRange && p.active));
        if (!found.length) return [{ label: 'No tank POD', kind: 'info' }];

          html: podCard(p), h: 92,

  // =================== Alarme (Kap. 7) ===================
  const ALARM_TYPES = [
    ['depth', 'Depth'], ['time', 'Dive time'], ['tank', 'Tank pressure'], ['ndl', 'NDL'], ['gastime', 'Gas time'], ['sidemount', 'Sidemount'],
  ];
  function alarms() {
    push(L({
      title: 'ALARMS',
      items: () => {
        const a = S.mode().alarms;
        return ALARM_TYPES.map(([k, lbl]) => ({ label: lbl, sub: a[k].length + ' alarms', onOk: () => alarmList(k, lbl) }))
          .concat([
            { label: 'Mute all audio', kind: 'toggle', value: a.muteAudio, set: (v) => { a.muteAudio = v; } },
            { label: 'Mute all vibration', kind: 'toggle', value: a.muteVib, set: (v) => { a.muteVib = v; } },
          ]);
      },
    }));
  }
  function alarmValStr(k, v) {
    if (k === 'depth') return depthStr(v, 1);
    if (k === 'time') return fmt.mmss(v);
    if (k === 'tank' || k === 'sidemount') { const p = SN.U.press(v); return p.v + ' ' + p.u; }
    return v + ' min';
  }
  function alarmList(k, lbl) {
    push(L({
      title: lbl.toUpperCase(),
      items: () => {
        const arr = S.mode().alarms[k];
        const its = arr.map((x, i) => ({ label: alarmValStr(k, x.v), sub: x.look === 'caution' ? 'Caution' : 'Notify', icon: iconBox(x.look === 'caution' ? I.warn : I.info, x.look === 'caution' ? 'yellow' : 'cyan'), onOk: () => alarmEdit(k, x) }));
        if (arr.length < 5) its.push({ label: 'New alarm', icon: iconBox(I.plus, 'green'), onOk: () => {
          const def = { depth: 30, time: 30 * 60, tank: 100, ndl: 5, gastime: 10, sidemount: 20 }[k];
          const x = { v: def, look: 'notify', tone: 'short', audio: true, vib: true, on: true };
          arr.push(x); alarmValue(k, x, true);
        } });
        return its;
      },
    }));
  }
  function alarmValue(k, x, isNew) {
    const done = () => { nav.pop(); if (isNew) alarmEdit(k, x); };
    if (k === 'time') {
      push(new PickerScreen({
        title: 'Dive time', final: 'check',
        cols: [{ values: range(0, 99, 1), index: Math.floor(x.v / 60), unit: 'min' }, { values: range(0, 59, 1), index: x.v % 60, unit: 's', fmt: (v) => String(v).padStart(2, '0') }],
        onDone: (v) => { x.v = Math.max(1, v[0] * 60 + v[1]); done(); },
      }));
      return;
    }
    let vals, unit, toV = (v) => v, fromV = (v) => v;
    if (k === 'depth') {
      vals = range(3, 199, 1); unit = SN.U.depth(0).u;
      if (unit === 'ft') { vals = range(10, 650, 5); toV = (v) => v / 3.28084; fromV = (v) => Math.round(v * 3.28084 / 5) * 5; }
    } else if (k === 'tank') {
      vals = range(51, 360, 1); unit = SN.U.press(0).u;
      if (unit === 'psi') { vals = range(740, 5220, 10); toV = (v) => v / 14.5038; fromV = (v) => Math.round(v * 14.5038 / 10) * 10; }
    } else if (k === 'sidemount') { vals = range(5, 70, 1); unit = SN.U.press(0).u; }
    else if (k === 'ndl') { vals = range(1, 99, 1); unit = 'min'; }
    else { vals = range(1, 99, 1); unit = 'min'; }
    let idx = vals.indexOf(fromV(x.v)); if (idx < 0) idx = 0;
    push(new PickerScreen({ title: ALARM_TYPES.find((a) => a[0] === k)[1], final: 'check', cols: [{ values: vals, index: idx, unit }], onDone: (v) => { x.v = toV(v[0]); done(); } }));
  }
  function alarmEdit(k, x) {
    push(L({
      title: ALARM_TYPES.find((a) => a[0] === k)[1].toUpperCase(),
      items: () => [
        { label: 'Alarm', sub: alarmValStr(k, x.v), onOk: () => alarmValue(k, x) },
        { label: 'Appearance', sub: x.look === 'caution' ? 'Caution' : 'Notify', onOk: () => push(L({
          title: 'APPEARANCE',
          items: () => [
            { label: 'Notify', icon: iconBox(I.info, 'cyan'), value: x.look === 'notify', onOk: () => { x.look = 'notify'; nav.pop(); } },
            { label: 'Caution', icon: iconBox(I.warn, 'yellow'), value: x.look === 'caution', onOk: () => { x.look = 'caution'; nav.pop(); } },
          ],
        })) },
        { label: 'Audio & vibration', sub: (x.audio ? t(x.tone === 'long' ? 'Long' : 'Short') : t('Off')) + ' · ' + t('Vibration') + ' ' + on(x.vib), onOk: () => push(L({
          title: 'AUDIO & VIBRATION',
          items: () => {
            const a = S.mode().alarms;
            return [
              { label: 'Alarm tone', sub: x.tone === 'long' ? 'Long' : 'Short', onOk: () => push(radioList('Alarm tone', [['short', 'Short'], ['long', 'Long']], () => x.tone, (v) => { x.tone = v; })) },
              { label: 'Audio', sub: on(x.audio && !a.muteAudio), kind: 'toggle', value: x.audio && !a.muteAudio, disabled: a.muteAudio, set: (v) => { x.audio = v; } },
              { label: 'Vibration', sub: on(x.vib && !a.muteVib), kind: 'toggle', value: x.vib && !a.muteVib, disabled: a.muteVib, set: (v) => { x.vib = v; } },
            ];
          },
        })) },
        { label: 'Delete', icon: iconBox(I.trash, 'red'), onOk: () => { const arr = S.mode().alarms[k]; arr.splice(arr.indexOf(x), 1); nav.pop(); } },
      ],
    }));
  }

  function viewEdit(v, isNew) {
    const work = { type: v.type, f: v.f.slice() };
    const s = L({
      title: isNew ? 'NEW VIEW' : 'EDIT VIEW ' + (S.mode().views.indexOf(v) + 1),
      cls: 'viewedit',
      top: () => {
        const prev = work.type === 'double'
          ? '<div class="pv half">' + (work.f[0] ? SN.face.fieldHTML(work.f[0], 'half') : '') + '</div><div class="pv half">' + (work.f[1] ? SN.face.fieldHTML(work.f[1], 'half') : '') + '</div>'
          : '<div class="pv large">' + (work.f[0] ? SN.face.fieldHTML(work.f[0], 'large') : '') + '</div>';
        return '<div class="vprev">' + prev + '</div>';
      },
      items: () => {
        const its = work.f.map((k, i) => ({ label: fname(k), sub: 'Field ' + (i + 1), cls: 'subtop', onOk: () => fieldPick(work, i) }));
        const ok = work.f.every(Boolean);
        if (isNew) its.push({ label: 'Save view', icon: iconBox(I.check, 'green'), disabled: !ok, onOk: () => { S.mode().views.push(work); nav.pop(); } });
        else {
          its.push({ label: 'Done', icon: iconBox(I.check, 'green'), onOk: () => { v.f = work.f; nav.pop(); } });
          if (S.mode().views.length > 1) its.push({ label: 'Delete view', icon: iconBox(I.trash, 'red'), onOk: () => { const vs = S.mode().views; vs.splice(vs.indexOf(v), 1); S.mode().viewIndex = 0; nav.pop(); } });
        }
        return its;
      },
    });
    push(s);
  }

    const keys = Object.keys(SN.face.FIELDS).filter((k) => work.type === 'large' || !SN.face.FIELDS[k].largeOnly);

  // =================== Tauchplaner (Kap. 10) ===================
  function planner() {
    const m = S.mode();
    const g = S.gf(m);
    push(new InfoScreen({
      cls: 'plain',
      content: () => SN.ui.hints() + '<div class="hdr"><div class="hdr-t">SETTINGS SUMMARY</div></div><div class="grid2">' +
        kv('GF', g.lo + ' / ' + g.hi) + kv('Gases', S.usableGases(m).map(fmt.gasName).join(', ')) +
        kv('Safety stop', SAFETY.find((x) => x[0] === m.algo.safety)[1]) + kv('Altitude', altOpts()[m.algo.altitude][1]) +
        kv('Last deco stop', depthStr(m.algo.lastStop, 0)) + '</div>',
      onOk: () => push(L({
        title: 'DIVE TYPE',
        items: [
          { label: 'No deco', onOk: () => plannerInterval('nodeco') },
          { label: 'Deco', onOk: () => plannerInterval('deco') },
        ],
      })),
    }));
  }
  function kv(k, v) { return '<div class="kv"><div class="k">' + esc(t(k)) + '</div><div class="v">' + esc(v) + '</div></div>'; }
  function plannerInterval(type) {
    const since = S.lastDiveEnd ? (S.now() - S.lastDiveEnd) / 60000 : 0;
    const start = Math.ceil(since / 10) * 10;
    const vals = [];
    for (let v = Math.min(start, 2880); v <= 2880; v += 10) vals.push(v);
    push(new PickerScreen({
      title: 'SURFACE INTERVAL', cols: [{ values: vals, index: 0, fmt: (v) => Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0') }],
      onDone: (v) => plannerDepth(type, v[0] - since),
    }));
  }
  function planTissues(extraMin) {
    const tt = S.tissues.clone();
    if (extraMin > 0) tt.load(S.env.psurf, 0, extraMin, { o2: 21, he: 0 });
    return tt;
  }
  function pctx() {
    const m = S.mode();
    const g = S.gf(m);
    return { m, env: { psurf: S.env.psurf, rho: S.waterRho(m) }, lo: g.lo / 100, hi: g.hi / 100, gas: S.activeGas(m), gases: S.usableGases(m), ps: S.algoSurf(m) };
  }
  function plannerDepth(type, extra) {
    const c = pctx();
    const tt = planTissues(extra);
    const ft = S.settings.units.depth === 'ft';
    const vals = ft ? range(10, 330, 5) : range(3, 100, 1);
    const toM = (v) => (ft ? v / 3.28084 : v);
    push(new PickerScreen({
      title: 'DEPTH', final: type === 'nodeco' ? 'check' : 'next',
      cols: [{ values: vals, index: vals.indexOf(ft ? 60 : 18), unit: ft ? 'ft' : 'm' }],
      footer: (v) => {
        const n = SN.Deco.ndl(tt, c.env, toM(v[0]), c.gas, c.hi, c.ps);
        const md = SN.U.depth(SN.Deco.mod(c.gas), 1);
        return '<span class="fk">NDL</span> ' + num(n >= 100 ? '>99' : n, 'min') + '<span class="sp"></span><span class="fk">MOD</span> ' + num(md.v, md.u);
      },
      onDone: (v) => (type === 'nodeco' ? noDecoPlan(tt, toM(v[0]), c) : bottomTime(tt, toM(v[0]), c)),
    }));
  }
  function noDecoPlan(tt, depth, c) {
    const row = (d) => {
      if (d <= 0) return '';
      const n = SN.Deco.ndl(tt, c.env, d, c.gas, c.hi, c.ps);
      const dd = SN.U.depth(d, 0);
      return '<div class="ndrow ' + (Math.abs(d - depth) < 0.01 ? 'cur' : '') + '"><span>' + num(dd.v, dd.u) + '</span><span>' + num(n >= 100 ? '>99' : n, 'min') + '</span><span>' + fmt.gasName(c.gas) + '</span></div>';
    };
    const n = SN.Deco.ndl(tt, c.env, depth, c.gas, c.hi, c.ps);
    const md = SN.U.depth(SN.Deco.mod(c.gas), 1);
    const dd = SN.U.depth(depth, 0);
    push(new InfoScreen({
      cls: 'tall',
      content: () => '<div class="hdr"><div class="hdr-t">NO DECO PLAN</div></div><div class="grid2">' +
        '<div class="kv"><div class="k">Depth</div><div class="v">' + num(dd.v, dd.u) + '</div></div><div class="kv"><div class="k">NDL</div><div class="v">' + num(n >= 100 ? '>99' : n, 'min') + '</div></div>' +
        '<div class="kv"><div class="k">Gas</div><div class="v">' + fmt.gasName(c.gas) + '</div></div><div class="kv"><div class="k">MOD</div><div class="v">' + num(md.v, md.u) + '</div></div></div>' +
        '<div class="ndl">' + [-10, -5, 0, 5, 10].map((x) => row(depth + x)).join('') + '</div><div class="donebtn">' + iconBox(I.check, 'green') + ' Done</div>',
      onOk: () => nav.popTo(2),
      onEnd: () => nav.popTo(2),
    }));
  }
  function bottomTime(tt, depth, c) {
    const vals = range(1, 180, 1);
    const calc = (bt) => {
      const x = tt.clone();
      const desc = depth / 10; // Abstieg 10 m/min (aus Screenshot "Deco plan": 36 m in 3'36)
      x.load(c.env.psurf, (SN.Deco.pAt(depth, c.env) - c.env.psurf) / desc, desc, c.gas);
      x.load(SN.Deco.pAt(depth, c.env), 0, bt, c.gas);
      const pl = SN.Deco.plan(x, depth, { env: c.env, gases: c.gases, gas: c.gas, gfLow: c.lo, gfHigh: c.hi, anchor: 0, lastStop: c.m.algo.lastStop, rate: 10, algoSurf: c.ps });
      return { pl, desc };
    };
    const n0 = SN.Deco.ndl(tt, c.env, depth, c.gas, c.hi, c.ps);
    push(new PickerScreen({
      title: 'BOTTOM TIME', final: 'check',
      cols: [{ values: vals, index: Math.min(24, vals.length - 1), unit: 'min' }],
      footer: (v) => {
        const { pl } = calc(v[0]);
        const ndlLeft = Math.max(0, n0 - v[0]);
        return '<span class="fk">NDL</span> ' + num(ndlLeft >= 100 ? '>99' : ndlLeft, 'min') + '<span class="sp"></span><span class="fk">TTS</span> ' + num(Math.ceil(pl.tts), 'min');
      },
      onDone: (v) => decoPlan(depth, v[0], calc(v[0]), n0, c),
    }));
  }
  function decoPlan(depth, bt, res, n0, c) {
    const { pl, desc } = res;
    const rows = [];
    const G0 = c.gas;
    const dRow = (cls, ic, d, tm, run, gas, txt) => rows.push('<div class="dprow"><span class="dpi ' + cls + '">' + ic + '</span><span class="dpd">' + num(SN.U.depth(d, 0).v, SN.U.depth(0).u) + '</span>' +
      (txt ? '<span class="dpx">' + esc(txt) + '</span>' : '<span class="dpt">' + tm + '</span><span class="dpr">' + run + '</span>') + '<span class="dpg">' + esc(fmt.gasName(gas)) + '</span></div>');
    const mm = (min) => fmt.mmss(Math.round(min * 60));
    dRow('desc', '↘', depth, '--', mm(desc), G0);
    let run = desc + bt;
    dRow('bot', '⤓', depth, mm(bt), mm(run), G0);
    // Aufstieg / Stopps / Gaswechsel
    const ev = [];
    pl.stops.forEach((s) => ev.push({ type: 'stop', depth: s.depth, time: s.time, gas: s.gas, run: s.run }));
    pl.segments.forEach((s) => ev.push({ type: 'switch', depth: s.depth, gas: s.gas, run: s.run - 0.0001 }));
    ev.sort((a, b) => a.run - b.run);
    let lastD = depth;
    let gasNow = G0;
    for (const e of ev) {
      if (e.depth < lastD) { dRow('asc', '↗', e.depth, '--', mm(run + e.run - (e.type === 'stop' ? e.time : 0)), gasNow); lastD = e.depth; }
      if (e.type === 'switch') { gasNow = e.gas; dRow('gas', '▮', e.depth, '', '', e.gas, 'Gas change'); }
      else dRow('stop', '⧗', e.depth, mm(e.time), mm(run + e.run), e.gas);
    }
    const total = run + pl.tts;
    dRow('surf', '≈', 0, '--', mm(total), gasNow);
    const decoT = pl.stops.reduce((a, s) => a + s.time, 0);
    // Profil
    const W = 600, H = 160;
    const maxD = Math.max(10, depth * 1.1);
    const X = (tm) => 20 + tm / total * (W - 40), Y = (d) => 10 + d / maxD * (H - 20);
    let path = 'M' + X(0) + ' ' + Y(0) + ' L' + X(desc) + ' ' + Y(depth) + ' L' + X(run) + ' ' + Y(depth);
    let tcur = run; let dcur = depth;
    for (const s of pl.stops) {
      const ta = run + s.run - s.time;
      path += ' L' + X(ta) + ' ' + Y(s.depth) + ' L' + X(run + s.run) + ' ' + Y(s.depth);
      tcur = run + s.run; dcur = s.depth;
    }
    path += ' L' + X(total) + ' ' + Y(0);
    const svg = '<svg class="prof" viewBox="0 0 ' + W + ' ' + H + '"><path d="' + path + ' L' + X(total) + ' ' + Y(0) + ' L' + X(0) + ' ' + Y(0) + 'Z" fill="#1b2a5a"/><path d="' + path + '" fill="none" stroke="#19e6c8" stroke-width="3"/></svg>';
    push(new InfoScreen({
      cls: 'tall',
      content: () => '<div class="hdr"><div class="hdr-t">DECO PLAN</div></div><div class="dplist">' + rows.join('') + '</div><div class="grid2">' +
        '<div class="kv"><div class="k">Total run time</div><div class="v">' + num(Math.ceil(total), 'min') + '</div></div><div class="kv"><div class="k">Total deco time</div><div class="v">' + num(Math.ceil(decoT), 'min') + '</div></div>' +
        '<div class="kv"><div class="k">Total NDL at ' + depthStr(depth, 0) + '</div><div class="v">' + num(n0 >= 100 ? '>99' : n0, 'min') + '</div></div></div>' + svg,
      onOk: () => nav.popTo(2),
    }));
  }

  /** 6-stelliger Code mit den Ziffern 1–4 = Tasten (1 oben links, 2 oben rechts, 3 unten links, 4 unten rechts) */
  class PasscodeScreen {
    constructor(o) { Object.assign(this, { code: '' }, o); }
    render() {
      let boxes = '';
      for (let i = 0; i < 6; i++) boxes += '<span class="pcd ' + (i < this.code.length ? 'f' : '') + '">' + (this.code[i] || '') + '</span>';
      return '<div class="scr passcode"><span class="pk k1">1</span><span class="pk k2">2</span><span class="pk k3">3</span><span class="pk k4">4</span>' +
        '<div class="pct">' + esc(this.title) + '</div><div class="pcb">' + boxes + '</div><div class="pch">Hold back button to delete</div></div>';
    }
    onButton(b, long) {
      if (long && b === 'back') { this.code = this.code.slice(0, -1); return true; }
      if (long) return true;
      const map = { up: '1', back: '2', down: '3', ok: '4' };
      this.code += map[b];
      if (this.code.length === 6) { const c = this.code; this.code = ''; this.onCode(c); }
      return true;
    }
  }
